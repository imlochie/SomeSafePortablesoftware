[package]
name = "archive-assistant-desktop"
version = "0.1.0"
description = "ARCHIVE ASSISTANT Windows desktop shell"
authors = ["ARCHIVE ASSISTANT"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
