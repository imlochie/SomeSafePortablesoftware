  /archive/inventory:
    get:
      operationId: getArchiveInventory
      tags: [archive]
      summary: Get local archive inventory and intelligence
      responses:
        "200":
          description: Owner-scoped local files and Plex comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventory"
  /archive/records/{id}:
    get:
      operationId: getArchiveRecord
      tags: [archive]
      summary: Get one local archive record with comparison details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Archive record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventoryRecord"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArchiveRecordReview
      tags: [archive]
      summary: Save a non-destructive review decision for an archive finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: Review is not valid for the current finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/reviews:
    post:
      operationId: updateArchiveRecordReviews
      tags: [archive]
      summary: Save one review decision for several archive findings
      description: |
        Applies the selected status and one optional shared note to each archive
        finding in `ids`. The note is persisted independently for every
        successful result. Sending `null` clears an existing note; omitting the
        property has the same effect at the API boundary. The Archive UI
        currently sends `null` because bulk note entry is not exposed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveBulkReviewUpdate"
      responses:
        "200":
          description: Per-record bulk review outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveBulkReviewResponse"
        "400":
          description: Bulk review input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/inspect:
    post:
      operationId: inspectMediaSource
      tags: [media]
      summary: Inspect a media URL without downloading it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInspectInput"
      responses:
        "200":
          description: Normalized media metadata and formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInspection"
        "400":
          description: Source could not be inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/local-inspect:
    post:
      operationId: inspectLocalMedia
      tags: [media]
      summary: Inspect a local media file with FFprobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalMediaInspectInput"
      responses:
        "200":
          description: Local media inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMediaInspection"
  /media/prepare-download:
    post:
      operationId: prepareDownload
      tags: [media]
      summary: Create a validated download specification without starting a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPreparationInput"
      responses:
        "200":
          description: Prepared download specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSpecification"
  /downloads:
    get:
      operationId: getDownloads
      tags: [downloads]
      summary: List persistent download jobs
      responses:
        "200":
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Create a persistent download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadJobInput"
      responses:
        "201":
          description: Created download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/events:
    get:
      operationId: streamDownloadEvents
      tags: [downloads]
      summary: Stream download and processing updates
      responses:
        "200":
          description: Server-sent download events
          content:
            text/event-stream:
              schema:
                type: string
  /downloads/{id}:
    get:
      operationId: getDownload
      tags: [downloads]
      summary: Get one download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: Delete a non-running download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204":
          description: Deleted
  /downloads/{id}/start:
    post:
      operationId: startDownload
      tags: [downloads]
      summary: Start a queued or recoverable download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Started download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/pause:
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pause a running download where supported
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Paused or safely stopped for resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/resume:
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resume a paused or recoverable download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Resumed download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/cancel:
    post:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancel a running download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Cancelled download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      tags: [downloads]
      summary: Retry a failed download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Retried download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /assistant/health:
    get:
      operationId: getAssistantArchiveHealth
      tags: [Assistant]
      responses:
        '200':
          description: Read-only archive health projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /archive/ordering-proposals:
    post:
      operationId: createArchiveOrderingProposal
      tags: [Archive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Immutable ordering proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderingProposalResponse"
  /archive/ordering-proposals/{id}:
    get:
      operationId: getArchiveOrderingProposal
      tags: [Archive]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Immutable ordering proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderingProposalResponse"
        '404':
          description: Proposal not found

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: number
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 500
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ArchiveNamingProposalIdentity:
      type: object
      additionalProperties: true
      description: |
        Parsed or proposed media identity. Movie identities contain title and
        year fields; TV identities contain show, season, episode, episodes,
        episodeTitle, and ambiguity fields.

    ArchiveNamingProposal:
      type: object
      required:
        - fileRecordId
        - localIdentityId
        - sourcePath
        - proposedPath
        - sourceFilename
        - proposedFilename
        - currentIdentity
        - proposedIdentity
        - patternId
        - confidence
        - operation
        - reason
        - evidence
        - mediaType
        - volumeId
        - archiveRoot
        - collision
      properties:
        fileRecordId:
          type: number

        localIdentityId:
          type: [number, "null"]

        sourcePath:
          type: string

        proposedPath:
          type: [string, "null"]

        sourceFilename:
          type: string

        proposedFilename:
          type: [string, "null"]

        currentIdentity:
          oneOf:
            - $ref: "#/components/schemas/ArchiveNamingProposalIdentity"
            - type: "null"

        proposedIdentity:
          oneOf:
            - $ref: "#/components/schemas/ArchiveNamingProposalIdentity"
            - type: "null"

        patternId:
          type: string

        confidence:
          type: string
          enum: [high, medium, low, uncertain]

        operation:
          type: string
          enum: [rename, restructure, move, uncertain/no_action]

        reason:
          type: string

        evidence:
          type: array
          items:
            type: string

        mediaType:
          type: string
          enum: [movie, tv]

        volumeId:
          type: string

        archiveRoot:
          type: string

        collision:
          type: boolean

    ArchiveNamingProposalSummary:
      type: object
      required:
        - total
        - highConfidence
        - mediumConfidence
        - lowConfidence
        - actionable
        - uncertain
        - collisions
      properties:
        total:
          type: number
          minimum: 0

        highConfidence:
          type: number
          minimum: 0

        mediumConfidence:
          type: number
          minimum: 0

        lowConfidence:
          type: number
          minimum: 0

        actionable:
          type: number
          minimum: 0

        uncertain:
          type: number
          minimum: 0

        collisions:
          type: number
          minimum: 0

    ArchiveNamingProposalPagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: number
          minimum: 1

        pageSize:
          type: number
          minimum: 1

        total:
          type: number
          minimum: 0

        totalPages:
          type: number
          minimum: 0

    ArchiveNamingProposalResponse:
      type: object
      required:
        - summary
        - pagination
        - results
      properties:
        summary:
          $ref: "#/components/schemas/ArchiveNamingProposalSummary"

        pagination:
          $ref: "#/components/schemas/ArchiveNamingProposalPagination"

        results:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveNamingProposal"
    StatusValue:
      type: string
      enum: [ready, connected, idle, placeholder, warning, unavailable, processing]
    AssistantGroup:
      type: object
      required: [id, type, state, priority, confidence, title, explanation, evidence, recommendedAction, underlyingItemIds, itemCount]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [download, integrity, rename, duplicate, identity, quality]
        state:
          type: string
          enum: [actionable, blocked, uncertain, informational, resolved]
        priority:
          type: string
          enum: [critical, high, medium, low, info]
        confidence: { type: string }
        title: { type: string }
        explanation: { type: string }
        evidence:
          type: array
          items: { type: string }
        recommendedAction: { type: string }
        underlyingItemIds:
          type: array
          items: { type: number }
        itemCount: { type: number, minimum: 1 }
    AssistantRecommendation:
      type: object
      required: [id, type, priority, confidence, title, explanation, evidence, recommendedAction, state, reviewItemId]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [download, integrity, rename, duplicate, identity, quality]
        priority:
          type: string
          enum: [critical, high, medium, low, info]
        confidence: { type: string }
        title: { type: string }
        explanation: { type: string }
        evidence:
          type: array
          items: { type: string }
        recommendedAction: { type: string }
        state: { type: string }
        reviewItemId: { type: [number, "null"] }
        personalContext:
          type: [object, "null"]
          required: [watchState, lastWatchedAt, playCount, watchedMinutes, seriesProgress, isNextEpisode]
          properties:
            watchState: { type: string }
            lastWatchedAt: { type: [string, "null"], format: date-time }
            playCount: { type: number, minimum: 0 }
            watchedMinutes: { type: number, minimum: 0 }
            seriesProgress: { type: [number, "null"], minimum: 0, maximum: 100 }
            isNextEpisode: { type: boolean }
        personalAffinity:
          type: [object, "null"]
          required: [priority, basedOn]
          properties:
            priority: { type: string, enum: [high, medium, low, unknown] }
            basedOn:
              type: array
              items: { type: string }
    CreateSourceMonitor:
      type: object
      required: [url]
      properties:
        name: { type: string }
        url: { type: string, minLength: 1 }
        kind: { type: string, enum: [rss, atom, json, html, telegram] }
        intervalMinutes: { type: number, minimum: 5, maximum: 1440 }
        discovery: { type: boolean, default: false }
        targets:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              mediaType: { type: string, enum: [movie, series, episode] }
              season: { type: number, minimum: 0 }
    AgentDownloadInspectInput:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl: { type: string, minLength: 1 }
        title: { type: string }
        forceRefresh: { type: boolean, default: false }
    AgentDownloadQueueInput:
      type: object
      required: [reviewItemId]
      properties:
        reviewItemId: { type: number, minimum: 1 }
        sourceUrl: { type: string }
        title: { type: string }
        selectedFormatId: { type: string }
        selectedVideoFormatId: { type: [string, "null"] }
        selectedAudioFormatId: { type: [string, "null"] }
        outputContainer: { type: string, enum: [mp4, mkv, webm] }
        temporaryDirectory: { type: string }
        destinationDirectory: { type: string }
        finalFilename: { type: string }
        start: { type: boolean, default: false }
    AgentDownloadSelection:
      type: object
      required: [kind, contract, source, selected, alternatives, review, safety]
      properties:
        kind: { type: string, enum: [download_source_selection] }
        contract: { type: string, enum: [agent-download-v1] }
        source: { type: object, additionalProperties: true }
        selected: { type: object, additionalProperties: true }
        alternatives: { type: array, items: { type: object, additionalProperties: true } }
        review: { type: object, additionalProperties: true }
        safety: { type: object, additionalProperties: true }
    AgentDownloadQueued:
      type: object
      required: [kind, contract, job, started, verification]
      properties:
        kind: { type: string, enum: [download_queued] }
        contract: { type: string, enum: [agent-download-v1] }
        job: { type: object, additionalProperties: true }
        started: { type: boolean }
        verification: { type: string }
    CreateAgentResearch:
      type: object
      properties:
        query: { type: string, maxLength: 1000 }
        includeComparisons: { type: boolean, default: true }
        includeUpcoming: { type: boolean, default: true }
    AgentResearchBrief:
      type: object
      required: [kind, contract, generatedAt, ownerScoped, sourcePolicy, upcoming, recent, queryResearch, comparisons, comparisonLimitations, personalContext]
      properties:
        kind: { type: string, enum: [archive_research_brief] }
        contract: { type: string, enum: [agent-research-v1] }
        generatedAt: { type: string, format: date-time }
        question: { type: [string, "null"] }
        ownerScoped: { type: boolean }
        sourcePolicy: { type: object, additionalProperties: true }
        upcoming: { type: object, additionalProperties: true }
        recent: { type: array, items: { type: object, additionalProperties: true } }
        queryResearch: { type: object, additionalProperties: true }
        comparisons: { type: object, additionalProperties: true }
        comparisonLimitations: { type: array, items: { type: string } }
        personalContext: { type: object, additionalProperties: true }
    CreateAgentInsight:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        maxActions: { type: number, minimum: 1, maximum: 5, default: 3 }
        includeOperationPlans: { type: boolean, default: true }
    AgentInsightBrief:
      type: object
      required: [kind, contract, generatedAt, question, source, safety, answerRequirements, snapshot, prioritizedEvidence, personalSignals, unknowns]
      properties:
        kind: { type: string, enum: [archive_insight_brief] }
        contract: { type: string, enum: [agent-insight-v1] }
        generatedAt: { type: string, format: date-time }
        question: { type: string }
        source: { type: object, additionalProperties: true }
        safety: { type: object, additionalProperties: true }
        answerRequirements: { type: array, items: { type: string } }
        snapshot: { type: object, additionalProperties: true }
        prioritizedEvidence: { type: array, items: { type: object, additionalProperties: true } }
        personalSignals: { type: object, additionalProperties: true }
        unknowns: { type: array, items: { type: object, additionalProperties: true } }
    AgentContext:
      type: object
      required: [generatedAt, source, safety, archive, personal]
      properties:
        generatedAt: { type: string, format: date-time }
        source:
          type: object
          required: [system, contract, ownerScoped]
          properties:
            system: { type: string }
            contract: { type: string }
            ownerScoped: { type: boolean }
        safety:
          type: object
          required: [mode, approvalRequired, preflightRequired, directMutation, providerExecution, unknownsMustRemainExplicit]
          properties:
            mode: { type: string, enum: [evidence_only] }
            approvalRequired: { type: boolean }
            preflightRequired: { type: boolean }
            directMutation: { type: boolean }
            providerExecution: { type: boolean }
            unknownsMustRemainExplicit: { type: boolean }
        archive: { type: object, additionalProperties: true }
        personal: { type: object, additionalProperties: true }
    AgentCapabilities:
      type: object
      required: [agent, capabilities, operationPolicy]
      properties:
        agent:
          type: object
          required: [id, mode]
          properties:
            id: { type: string }
            mode: { type: string, enum: [local, hosted] }
        capabilities:
          type: object
          required: [read, plan, operate]
          properties:
            read: { type: boolean }
            plan: { type: boolean }
            operate: { type: boolean }
        operationPolicy:
          type: object
          required: [approvalRequired, preflightRequired, directMutation, providerExecution]
          properties:
            approvalRequired: { type: boolean }
            preflightRequired: { type: boolean }
            directMutation: { type: boolean }
            providerExecution: { type: boolean }
    AssistantOverviewSummary:
      type: object
      required: [health, attentionCount, counts, blockedCount, uncertainCount, lastScan, freshness]
      properties:
        health:
          type: string
          enum: [healthy, mostly_healthy, attention_required]
        attentionCount: { type: number, minimum: 0 }
        counts:
          type: object
          required: [critical, high, medium, low, info]
          properties:
            critical: { type: number, minimum: 0 }
            high: { type: number, minimum: 0 }
            medium: { type: number, minimum: 0 }
            low: { type: number, minimum: 0 }
            info: { type: number, minimum: 0 }
        blockedCount: { type: number, minimum: 0 }
        uncertainCount: { type: number, minimum: 0 }
        lastScan: { type: [string, "null"] }
        freshness: { type: string }
    AssistantWorkload:
      type: object
      required: [items, counts, generatedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantWorkloadItem"
        counts:
          type: object
          required: [needs_you, being_handled, waiting, interesting, completed, dismissed, superseded, blocked, uncertain]
          additionalProperties: false
          properties:
            needs_you: { type: number, minimum: 0 }
            being_handled: { type: number, minimum: 0 }
            waiting: { type: number, minimum: 0 }
            interesting: { type: number, minimum: 0 }
            completed: { type: number, minimum: 0 }
            dismissed: { type: number, minimum: 0 }
            superseded: { type: number, minimum: 0 }
            blocked: { type: number, minimum: 0 }
            uncertain: { type: number, minimum: 0 }
        generatedAt: { type: string, format: date-time }
    AssistantWorkloadItem:
      type: object
      required: [id, title, reviewItemId, findingClassification, currentObservationId, provider, refreshId, evidenceKey, observedAt, changeContext, summary, state, needsUserAction, nextStep, destination, source, sourceId, evidence, confidence, lastConfirmedAt, freshness]
      properties:
        id: { type: string }
        title: { type: string }
        reviewItemId: { type: number, nullable: true }
        findingClassification: { type: string, nullable: true }
        currentObservationId: { type: number, nullable: true }
        provider: { type: string, nullable: true }
        refreshId: { type: string, nullable: true }
        evidenceKey: { type: string, nullable: true }
        observedAt: { type: string, format: date-time, nullable: true }
        changeContext:
          type: object
          nullable: true
          required: [previousObservationId, previousEvidenceKey, previousObservedAt]
          properties:
            previousObservationId: { type: number }
            previousEvidenceKey: { type: string }
            previousObservedAt: { type: string, format: date-time }
        summary: { type: string }
        state: { type: string, enum: [needs_you, being_handled, waiting, interesting, completed, dismissed, blocked, uncertain] }
        needsUserAction: { type: boolean }
        nextStep: { type: string }
        destination: { type: string, enum: [assistant, queue, history] }
        source: { type: string, enum: [assistant, download, review, health] }
        sourceId: { type: string }
        evidence: { type: array, items: { type: string } }
        confidence: { type: [string, "null"] }
        lastConfirmedAt: { type: [string, "null"], format: date-time }
        freshness: { type: string, enum: [fresh, recent, stale, unknown] }
    AssistantWorkloadLineage:
      type: object
      required: [workloadId, title, origin, review, approval, acquisition, download, verification, operation, outcome]
      properties:
        workloadId: { type: string }
        title: { type: string }
        origin: { $ref: "#/components/schemas/AssistantLineageStage" }
        review: { $ref: "#/components/schemas/AssistantLineageStage" }
        approval: { $ref: "#/components/schemas/AssistantLineageStage" }
        acquisition: { $ref: "#/components/schemas/AssistantLineageStage" }
        download: { $ref: "#/components/schemas/AssistantLineageStage" }
        verification: { $ref: "#/components/schemas/AssistantLineageStage" }
        operation: { $ref: "#/components/schemas/AssistantLineageStage" }
        outcome: { $ref: "#/components/schemas/AssistantLineageStage" }
    AssistantLineageStage:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [known, unknown, not_applicable] }
        id: { type: [string, "null"] }
        label: { type: string }
        detail: { type: string }
        occurredAt: { type: [string, "null"], format: date-time }
    AssistantOverview:
      type: object
      required: [summary, attention, recommendations, groups, blocked, uncertain, informational, activeWork, mediaExperience, discovery, personalizedBriefing]
      properties:
        summary:
          $ref: "#/components/schemas/AssistantOverviewSummary"
        attention:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRecommendation"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRecommendation"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/AssistantGroup"
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRecommendation"
