openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Local system status and diagnostics
  - name: settings
    description: Local application settings
  - name: plex
    description: Plex connection configuration
  - name: media
    description: Local media inspection and source selection
  - name: downloads
    description: Persistent local download jobs
  - name: archive
    description: Local archive inventory and media intelligence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Get archive system overview
      responses:
        "200":
          description: Current system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      tags: [system]
      summary: Detect optional local dependencies
      responses:
        "200":
          description: Detected dependency statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyStatus"
  /system/events:
    get:
      operationId: getSystemEvents
      tags: [system]
      summary: Get recent system events
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /plex/config:
    get:
      operationId: getPlexConfig
      tags: [plex]
      summary: Get Plex configuration status
      responses:
        "200":
          description: Plex configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
    patch:
      operationId: updatePlexConfig
      tags: [plex]
      summary: Update Plex configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConfigUpdate"
      responses:
        "200":
          description: Updated Plex configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/test-connection:
    post:
      operationId: testPlexConnection
      tags: [plex]
      summary: Verify the configured Plex server
      responses:
        "200":
          description: Actual Plex connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/sync:
    post:
      operationId: startPlexSync
      tags: [plex]
      summary: Start synchronizing the configured Plex inventory
      responses:
        "202":
          description: Plex synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/inventory:
    get:
      operationId: getPlexInventory
      tags: [plex]
      summary: Get the synchronized Plex inventory
      responses:
        "200":
          description: Owner-scoped Plex libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexInventory"
  /archive/scan:
    get:
      operationId: getArchiveScan
      tags: [archive]
      summary: Get the current local archive scan state
      responses:
        "200":
          description: Owner-scoped archive scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
    post:
      operationId: startArchiveScan
      tags: [archive]
      summary: Start a server-side archive filesystem scan
      responses:
        "202":
          description: Archive scan started or already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
  /archive/inventory:
    get:
      operationId: getArchiveInventory
      tags: [archive]
      summary: Get local archive inventory and intelligence
      responses:
        "200":
          description: Owner-scoped local files and Plex comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventory"
  /archive/records/{id}:
    get:
      operationId: getArchiveRecord
      tags: [archive]
      summary: Get one local archive record with comparison details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Archive record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventoryRecord"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArchiveRecordReview
      tags: [archive]
      summary: Save a non-destructive review decision for an archive finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: Review is not valid for the current finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/inspect:
    post:
      operationId: inspectMediaSource
      tags: [media]
      summary: Inspect a media URL without downloading it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInspectInput"
      responses:
        "200":
          description: Normalized media metadata and formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInspection"
        "400":
          description: Source could not be inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/local-inspect:
    post:
      operationId: inspectLocalMedia
      tags: [media]
      summary: Inspect a local media file with FFprobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalMediaInspectInput"
      responses:
        "200":
          description: Local media inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMediaInspection"
  /media/prepare-download:
    post:
      operationId: prepareDownload
      tags: [media]
      summary: Create a validated download specification without starting a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPreparationInput"
      responses:
        "200":
          description: Prepared download specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSpecification"
  /downloads:
    get:
      operationId: getDownloads
      tags: [downloads]
      summary: List persistent download jobs
      responses:
        "200":
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Create a persistent download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadJobInput"
      responses:
        "201":
          description: Created download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/events:
    get:
      operationId: streamDownloadEvents
      tags: [downloads]
      summary: Stream download and processing updates
      responses:
        "200":
          description: Server-sent download events
          content:
            text/event-stream:
              schema:
                type: string
  /downloads/{id}:
    get:
      operationId: getDownload
      tags: [downloads]
      summary: Get one download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: Delete a non-running download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204":
          description: Deleted
  /downloads/{id}/start:
    post:
      operationId: startDownload
      tags: [downloads]
      summary: Start a queued or recoverable download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Started download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/pause:
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pause a running download where supported
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Paused or safely stopped for resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/resume:
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resume a paused or recoverable download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Resumed download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/cancel:
    post:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancel a running download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Cancelled download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      tags: [downloads]
      summary: Retry a failed download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Retried download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
components:
  parameters:
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StatusValue:
      type: string
      enum: [ready, connected, idle, placeholder, warning, unavailable, processing]
    SystemOverview:
      type: object
      required: [archiveStatus, plexStatus, queueStatus, processingStatus, storageStatus, aiStatus, lastSync, activity, activeDownloads, queuedJobs, processingJobs, completedToday, failedToday, storage]
      properties:
        archiveStatus:
          $ref: "#/components/schemas/StatusValue"
        plexStatus:
          $ref: "#/components/schemas/StatusValue"
        queueStatus:
          $ref: "#/components/schemas/StatusValue"
        processingStatus:
          $ref: "#/components/schemas/StatusValue"
        storageStatus:
          $ref: "#/components/schemas/StatusValue"
        aiStatus:
          $ref: "#/components/schemas/StatusValue"
        lastSync:
          type: ["string", "null"]
          format: date-time
        activity:
          type: array
          items:
            $ref: "#/components/schemas/SystemEvent"
        activeDownloads:
          type: number
        queuedJobs:
          type: number
        processingJobs:
          type: number
        completedToday:
          type: number
        failedToday:
          type: number
        storage:
          $ref: "#/components/schemas/StorageSummary"
    StorageSummary:
      type: object
      required: [path, freeBytes, totalBytes, usedBytes, freePercent, status]
      properties:
        path:
          type: string
        freeBytes:
          type: number
        totalBytes:
          type: number
        usedBytes:
          type: number
        freePercent:
          type: number
        status:
          type: string
          enum: [ready, warning, critical, unavailable]
    DependencyStatus:
      type: object
      required: [name, command, status, detail, version, capabilities]
      properties:
        name:
          type: string
        command:
          type: string
        status:
          type: string
          enum: [available, missing, not_configured]
        detail:
          type: string
        version:
          type: ["string", "null"]
        capabilities:
          type: array
          items:
            type: string
    SystemEvent:
      type: object
      required: [id, level, message, timestamp, source]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          type: string
    AppSettings:
      type: object
      required: [mockMode, dataDirectory, downloadDirectory, archiveDirectory, temporaryDirectory, ytDlpPath, ffmpegPath, ffprobePath, logLevel, hardwareAcceleration, hardwareAccelerationMode, networkMode, concurrentDownloads, maxRetries, bandwidthLimit, outputContainer, inspectionCacheMinutes, warningFreePercent, criticalFreePercent]
      properties:
        mockMode:
          type: boolean
        dataDirectory:
          type: string
        downloadDirectory:
          type: string
        archiveDirectory:
          type: string
        temporaryDirectory:
          type: string
        ytDlpPath:
          type: string
        ffmpegPath:
          type: string
        ffprobePath:
          type: string
        logLevel:
          type: string
          enum: [info, debug, warn, error]
        hardwareAcceleration:
          type: boolean
        hardwareAccelerationMode:
          type: string
          enum: [auto, disabled]
        networkMode:
          type: string
          enum: [offline, local_only, allow_network]
        concurrentDownloads:
          type: number
          minimum: 1
          maximum: 5
        maxRetries:
          type: number
          minimum: 0
          maximum: 10
        bandwidthLimit:
          type: number
          minimum: 0
        outputContainer:
          type: string
          enum: [mp4, mkv, webm]
        inspectionCacheMinutes:
          type: number
          minimum: 1
          maximum: 120
        warningFreePercent:
          type: number
          minimum: 1
          maximum: 50
        criticalFreePercent:
          type: number
          minimum: 1
          maximum: 25
    AppSettingsUpdate:
      type: object
      properties:
        mockMode:
          type: boolean
        dataDirectory:
          type: string
        downloadDirectory:
          type: string
        archiveDirectory:
          type: string
        temporaryDirectory:
          type: string
        ytDlpPath:
          type: string
        ffmpegPath:
          type: string
        ffprobePath:
          type: string
        logLevel:
          type: string
          enum: [info, debug, warn, error]
        hardwareAcceleration:
          type: boolean
        hardwareAccelerationMode:
          type: string
          enum: [auto, disabled]
        networkMode:
          type: string
          enum: [offline, local_only, allow_network]
        concurrentDownloads:
          type: number
          minimum: 1
          maximum: 5
        maxRetries:
          type: number
          minimum: 0
          maximum: 10
        bandwidthLimit:
          type: number
          minimum: 0
        outputContainer:
          type: string
          enum: [mp4, mkv, webm]
        inspectionCacheMinutes:
          type: number
          minimum: 1
          maximum: 120
        warningFreePercent:
          type: number
          minimum: 1
          maximum: 50
        criticalFreePercent:
          type: number
          minimum: 1
          maximum: 25
    PlexConfig:
      type: object
      required: [serverUrl, configured, hasToken, status, connectionStatus, syncStatus, lastAttemptedAt, lastSuccessfulSyncAt, lastError, serverName, libraryCount, itemCount, mediaCount]
      properties:
        serverUrl:
          type: string
        configured:
          type: boolean
        hasToken:
          type: boolean
        status:
          type: string
          enum: [not_configured, configured, connection_failed, connected, syncing, synced, sync_error]
        connectionStatus:
          type: string
          enum: [not_configured, configured, connection_failed, connected]
        syncStatus:
          type: string
          enum: [idle, syncing, synced, sync_error]
        lastAttemptedAt:
          type: [string, "null"]
        lastSuccessfulSyncAt:
          type: [string, "null"]
        lastError:
          type: [string, "null"]
        serverName:
          type: [string, "null"]
        libraryCount:
          type: number
          minimum: 0
        itemCount:
          type: number
          minimum: 0
        mediaCount:
          type: number
          minimum: 0
    PlexConfigUpdate:
      type: object
      properties:
        serverUrl:
          type: string
        token:
          type: string
          writeOnly: true
    PlexInventory:
      type: object
      required: [libraries, items]
      properties:
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/PlexLibrary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlexInventoryItem"
    PlexLibrary:
      type: object
      required: [id, key, name, type, serverUrl, itemCount, lastSyncedAt, syncStatus, syncError]
      properties:
        id:
          type: number
        key:
          type: string
        name:
          type: string
        type:
          type: string
        serverUrl:
          type: string
        itemCount:
          type: number
          minimum: 0
        lastSyncedAt:
          type: [string, "null"]
        syncStatus:
          type: string
        syncError:
          type: [string, "null"]
    PlexInventoryItem:
      type: object
      required: [id, libraryId, libraryName, ratingKey, title, itemType, year, thumbPathAvailable, addedAt, updatedAt, mediaCount, partCount]
      properties:
        id:
          type: number
        libraryId:
          type: number
        libraryName:
          type: string
        ratingKey:
          type: string
        title:
          type: string
        itemType:
          type: string
        year:
          type: [number, "null"]
        thumbPathAvailable:
          type: boolean
        addedAt:
          type: [string, "null"]
        updatedAt:
          type: [string, "null"]
        mediaCount:
          type: number
          minimum: 0
        partCount:
          type: number
          minimum: 0
    ArchiveScan:
      type: object
      required: [status, startedAt, completedAt, lastError, scannedFiles, activeFiles, failedFiles, duplicateCount, missingCount, qualityConflictCount, plexOnlyCount, localOnlyCount]
      properties:
        status:
          type: string
          enum: [not_scanned, scanning, completed, failed]
        startedAt:
          type: [string, "null"]
        completedAt:
          type: [string, "null"]
        lastError:
          type: [string, "null"]
        scannedFiles:
          type: number
          minimum: 0
        activeFiles:
          type: number
          minimum: 0
        failedFiles:
          type: number
          minimum: 0
        duplicateCount:
          type: number
          minimum: 0
        missingCount:
          type: number
          minimum: 0
        qualityConflictCount:
          type: number
          minimum: 0
        plexOnlyCount:
          type: number
          minimum: 0
        localOnlyCount:
          type: number
          minimum: 0
    ArchiveInventorySummary:
      type: object
      required: [activeFiles, failedFiles, duplicateCount, missingCount, qualityConflictCount, plexOnlyCount, localOnlyCount, reviewedCount, unresolvedCount]
      properties:
        activeFiles:
          type: number
          minimum: 0
        failedFiles:
          type: number
          minimum: 0
        duplicateCount:
          type: number
          minimum: 0
        missingCount:
          type: number
          minimum: 0
        qualityConflictCount:
          type: number
          minimum: 0
        plexOnlyCount:
          type: number
          minimum: 0
        localOnlyCount:
          type: number
          minimum: 0
        reviewedCount:
          type: number
          minimum: 0
        unresolvedCount:
          type: number
          minimum: 0
    ArchiveReviewUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reviewed, deferred, unresolved]
        note:
          type: [string, "null"]
          maxLength: 500
    ArchiveReview:
      type: object
      required: [status, findingType, note, reviewedAt, updatedAt]
      properties:
        status:
          type: string
          enum: [reviewed, deferred, unresolved]
        findingType:
          type: string
        note:
          type: [string, "null"]
        reviewedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArchivePlexMatch:
      type: object
      required: [ratingKey, title, year, qualityDifferences]
      properties:
        ratingKey:
          type: string
        title:
          type: string
        year:
          type: [number, "null"]
        qualityDifferences:
          type: array
          items:
            type: string
    ArchivePlexOnlyRecord:
      type: object
      required: [ratingKey, title, itemType, year, qualitySummary]
      properties:
        ratingKey:
          type: string
        title:
          type: string
        itemType:
          type: string
        year:
          type: [number, "null"]
        qualitySummary:
          type: string
    ArchiveInventoryRecord:
      type: object
      required: [id, archiveItemId, filename, path, relativePath, sizeBytes, checksum, mediaType, scanStatus, errorMessage, durationSeconds, videoCodec, audioCodec, width, height, fps, bitrate, container, dynamicRange, audioChannels, audioLanguages, subtitleLanguages, lastSeenAt, qualityStatus, qualitySummary, qualityDifferences, duplicateOfId, plexMatch, reviewStatus, reviewNote, reviewUpdatedAt]
      properties:
        id:
          type: number
        archiveItemId:
          type: [number, "null"]
        filename:
          type: string
        path:
          type: string
        relativePath:
          type: string
        sizeBytes:
          type: [number, "null"]
        checksum:
          type: [string, "null"]
        mediaType:
          type: [string, "null"]
        scanStatus:
          type: string
          enum: [active, missing, error]
        errorMessage:
          type: [string, "null"]
        durationSeconds:
          type: [number, "null"]
        videoCodec:
          type: [string, "null"]
        audioCodec:
          type: [string, "null"]
        width:
          type: [number, "null"]
        height:
          type: [number, "null"]
        fps:
          type: [number, "null"]
        bitrate:
          type: [number, "null"]
        container:
          type: [string, "null"]
        dynamicRange:
          type: [string, "null"]
        audioChannels:
          type: [number, "null"]
        audioLanguages:
          type: array
          items:
            type: string
        subtitleLanguages:
          type: array
          items:
            type: string
        lastSeenAt:
          type: [string, "null"]
        qualityStatus:
          type: string
          enum: [best_local_version, lower_quality_version, higher_quality_available, duplicate, plex_version_exists, local_only, file_missing, needs_review]
        qualitySummary:
          type: string
        qualityDifferences:
          type: array
          items:
            type: string
        duplicateOfId:
          type: [number, "null"]
        plexMatch:
          oneOf:
            - $ref: "#/components/schemas/ArchivePlexMatch"
            - type: "null"
        reviewStatus:
          type: string
          enum: [not_applicable, unreviewed, reviewed, deferred, unresolved]
        reviewNote:
          type: [string, "null"]
        reviewUpdatedAt:
          type: [string, "null"]
    ArchiveInventory:
      type: object
      required: [scan, summary, records, plexOnly]
      properties:
        scan:
          $ref: "#/components/schemas/ArchiveScan"
        summary:
          $ref: "#/components/schemas/ArchiveInventorySummary"
        records:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveInventoryRecord"
        plexOnly:
          type: array
          items:
            $ref: "#/components/schemas/ArchivePlexOnlyRecord"
    MediaInspectInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 8
        forceRefresh:
          type: boolean
    LocalMediaInspectInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
    MediaMetadata:
      type: object
      required: [title, uploader, channel, description, durationSeconds, uploadDate, thumbnailUrl, webpageUrl, extractor, sourceId, playlistTitle, playlistIndex]
      properties:
        title:
