openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Local system status and diagnostics
  - name: assistant
    description: Deterministic archive intelligence and recommendations
  - name: settings
    description: Local application settings
  - name: plex
    description: Plex connection configuration
  - name: jellyfin
    description: Jellyfin connection configuration
  - name: integrations
    description: External media integration adapter status
  - name: acquisition
    description: Durable provider-backed acquisition lifecycle
  - name: media
    description: Local media inspection and source selection
  - name: downloads
    description: Persistent local download jobs
  - name: archive
    description: Local archive inventory and media intelligence
  - name: review
    description: Generic owner-scoped approval queue
  - name: operations
    description: Approval-gated archive filesystem operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agent/canonical/status:
    get:
      operationId: getArenaCanonicalStatus
      tags: [agent]
      summary: Get Arena Canonical bridge status
      responses:
        "200": { description: Bridge status, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /agent/canonical/tools:
    get:
      operationId: getArenaCanonicalTools
      tags: [agent]
      summary: Get the Archive Assistant tool manifest for Arena Canonical
      responses:
        "200": { description: Agent tool manifest, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /agent/canonical/ask:
    post:
      operationId: askArenaCanonical
      tags: [agent]
      summary: Ask Arena Canonical to reason over owner-scoped archive evidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [question], additionalProperties: true }
      responses:
        "200": { description: Evidence-grounded answer, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Invalid question }
        "503": { description: Arena Canonical is not configured }
  /agent/capabilities:
    get:
      operationId: getAgentCapabilities
      tags: [agent]
      summary: Get the server-enforced agent boundary
      responses:
        "200":
          description: Agent capabilities and operation policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilities"
  /integrations/{id}/test:
    post:
      operationId: testIntegrationConnection
      tags: [integrations]
      summary: Test one integration plugin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Integration diagnostic, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /integrations/config:
    get:
      operationId: getIntegrationConfigurationStatus
      tags: [integrations]
      summary: Get configured integration fields without exposing secrets
      responses:
        "200":
          description: Integration configuration status
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /integrations/config/{id}:
    put:
      operationId: updateIntegrationConfiguration
      tags: [integrations]
      summary: Save local configuration for an integration plugin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Configuration saved
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid configuration }
  /agent/monitoring/sources:
    get:
      operationId: listAgentSourceMonitors
      tags: [agent, monitoring]
      summary: List owner-scoped source monitors and notifications
      responses:
        "200":
          description: Source monitors and notifications
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: createAgentSourceMonitor
      tags: [agent, monitoring]
      summary: Add a public or authorized source monitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceMonitor" }
      responses:
        "201":
          description: Created source monitor
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /agent/monitoring/notifications/{id}/read:
    post:
      operationId: markAgentMonitorNotificationRead
      tags: [agent, monitoring]
      summary: Mark a monitoring notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated notification, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /agent/monitoring/sources/{id}/check:
    post:
      operationId: checkAgentSourceMonitor
      tags: [agent, monitoring]
      summary: Check a source monitor now
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Monitor check result and new notifications
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /agent/monitoring/sources/{id}:
    patch:
      operationId: updateAgentSourceMonitor
      tags: [agent, monitoring]
      summary: Update a source monitor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Updated monitor, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    delete:
      operationId: deleteAgentSourceMonitor
      tags: [agent, monitoring]
      summary: Delete a source monitor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
  /agent/downloads/resolve:
    post:
      operationId: resolveAgentDownloadRedirects
      tags: [agent, downloads]
      summary: Follow ordinary public HTTP redirects without bypassing access controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sourceUrl], additionalProperties: true }
      responses:
        "200": { description: Public redirect chain, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { description: Redirect resolution stopped or failed }
  /agent/downloads/inspect:
    post:
      operationId: inspectAgentDownloadSource
      tags: [agent, downloads]
      summary: Inspect a link and propose the highest-quality usable source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDownloadInspectInput"
      responses:
        "200":
          description: Source formats and approval-gated selection proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDownloadSelection"
        "400":
          description: Source inspection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/downloads/queue:
    post:
      operationId: queueAgentDownload
      tags: [agent, downloads]
      summary: Queue an approved highest-quality download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDownloadQueueInput"
      responses:
        "201":
          description: Approved download queued or started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDownloadQueued"
        "400":
          description: Approval or download request invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/research:
    post:
      operationId: createAgentResearchBrief
      tags: [agent, research]
      summary: Compare archive, provider, viewing, and external research evidence
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentResearch"
      responses:
        "200":
          description: Research brief with source comparison, upcoming media, and limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResearchBrief"
        "400":
          description: Invalid research request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/insights:
    post:
      operationId: createAgentInsightBrief
      tags: [agent]
      summary: Build a prioritized evidence brief for a reasoning agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentInsight"
      responses:
        "200":
          description: Prioritized, redacted evidence brief; it does not execute changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentInsightBrief"
        "400":
          description: Invalid insight request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent/context:
    get:
      operationId: getAgentContext
      tags: [agent]
      summary: Get bounded evidence for an external reasoning agent
      responses:
        "200":
          description: Owner-scoped, redacted archive evidence and safety policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentContext"
        "401":
          description: Authentication required
  /events:
    get:
      operationId: streamAgentEvents
      tags: [agent]
      summary: Stream owner-scoped persisted system events
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Authentication required
  /operations/plan:
    post:
      operationId: planAgentOperation
      tags: [agent, operations]
      summary: Persist an approval-gated operation plan without executing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArchiveOperation"
      responses:
        "201":
          description: Persisted operation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveOperation"
        "400":
          description: Invalid request or missing approval linkage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/research:
    get:
      operationId: researchAssistantCandidate
      tags: [assistant]
      summary: Research an external media candidate
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Read-only external research results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResponse"
  /assistant/media-profile:
    get:
      operationId: readMediaProfile
      tags: [assistant]
      summary: Read owner-scoped personal media profile and archive graph
      responses:
        "200":
          description: Personal media profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaProfileResponse" }
  /assistant/archive-context:
    get:
      operationId: readArchiveContext
      tags: [assistant]
      summary: Read owner-scoped archive graph context
      responses:
        "200":
          description: Archive graph context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveGraph" }
  /assistant/research/reasoning:
    get:
      operationId: readPersonalReasoning
      tags: [assistant]
      summary: Read structured personal media reasoning
      responses:
        "200":
          description: Read-only multi-evidence reasoning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalReasoningResponse"
  /assistant/research/curation:
    get:
      operationId: readPersonalCuration
      tags: [assistant]
      summary: Read ranked watch and archive curation
      responses:
        "200":
          description: Read-only personal curation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalCurationResponse"
  /assistant/research/synthesis:
    get:
      operationId: synthesizeViewingResearch
      tags: [assistant]
      summary: Reconcile multi-source research evidence
      responses:
        "200":
          description: Read-only multi-source research synthesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSynthesisResponse"
  /assistant/research/evaluations:
    get:
      operationId: evaluateViewingResearch
      tags: [assistant]
      summary: Evaluate relationship candidates with evidence
      responses:
        "200":
          description: Read-only contextual research evaluations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchEvaluationResponse"
  /assistant/research/history:
    get:
      operationId: researchFromViewingHistory
      tags: [assistant]
      summary: Generate bounded relationship candidates from viewing history
      responses:
        "200":
          description: Read-only relationship-based research candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchHistoryResponse"
  /assistant/workload:
    get:
      operationId: getAssistantWorkload
      tags: [assistant]
      summary: Get the unified read-only workload
      responses:
        "200":
          description: Workload derived from assistant, review, and download truth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantWorkload"
  /assistant/workload/{workloadId}/lineage:
    get:
      operationId: getAssistantWorkloadLineage
      tags: [assistant]
      summary: Explain the read-only lineage of a workload item
      parameters:
        - name: workloadId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Known and unknown lineage stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantWorkloadLineage"
        "404":
          description: Workload item not found for this owner
  /assistant/overview:
    get:
      operationId: getAssistantOverview
      tags: [assistant]
      summary: Get deterministic assistant overview
      responses:
        "200":
          description: Archive intelligence briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantOverview"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Get archive system overview
      responses:
        "200":
          description: Current system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      tags: [system]
      summary: Detect optional local dependencies
      responses:
        "200":
          description: Detected dependency statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDependencies"
  /system/storage-diagnostics:
    get:
      operationId: getStorageDiagnostics
      tags: [system]
      summary: Report which database this process has open and what it contains
      responses:
        "200":
          description: Storage diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageDiagnostics"
  /system/events:
    get:
      operationId: getSystemEvents
      tags: [system]
      summary: Get recent system events
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /provider/refresh:
    get:
      operationId: getProviderRefreshState
      summary: Read provider refresh state and current authority
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [plex, jellyfin] } }
      responses:
        '200':
          description: Provider refresh state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderRefreshState' }
  /provider/refresh/history:
    get:
      operationId: listProviderRefreshHistory
      summary: List bounded provider refresh history
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [plex, jellyfin] } }
        - { name: page, in: query, required: false, schema: { type: number, minimum: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: number, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Provider refresh history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderRefreshHistory' }
  /archive/reconciliation/findings/{reviewItemId}/lineage:
    get:
      operationId: getReconciliationFindingLineage
      summary: Read bounded reconciliation finding lineage
      parameters:
        - { name: reviewItemId, in: path, required: true, schema: { type: number, minimum: 1 } }
      responses:
        '200':
          description: Current and previous reconciliation observation context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationFindingLineage' }
        '404':
          description: Finding not found
  /plex/config:
    get:
      operationId: getPlexConfig
      tags: [plex]
      summary: Get Plex configuration status
      responses:
        "200":
          description: Plex configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
    patch:
      operationId: updatePlexConfig
      tags: [plex]
      summary: Update Plex configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConfigUpdate"
      responses:
        "200":
          description: Updated Plex configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/test-connection:
    post:
      operationId: testPlexConnection
      tags: [plex]
      summary: Verify the configured Plex server
      responses:
        "200":
          description: Actual Plex connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/sync:
    post:
      operationId: startPlexSync
      tags: [plex]
      summary: Start synchronizing the configured Plex inventory
      responses:
        "202":
          description: Plex synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/inventory:
    get:
      operationId: getPlexInventory
      tags: [plex]
      summary: Get the synchronized Plex inventory
      responses:
        "200":
          description: Owner-scoped Plex libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexInventory"
  /plex/hierarchy:
    get:
      operationId: getPlexHierarchy
      tags: [plex]
      summary: Get the owner-scoped Plex media hierarchy
      parameters:
        - { name: libraryId, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: Plex series with persisted season and episode relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexHierarchy"
  /plex/artwork/{ratingKey}:
    get:
      operationId: getPlexArtwork
      tags: [plex]
      summary: Get owner-scoped Plex artwork
      parameters:
        - name: ratingKey
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        "200":
          description: Validated Plex artwork bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "400":
          description: Invalid or unavailable Plex configuration
  /jellyfin/config:
    get:
      operationId: getJellyfinConfig
      tags: [jellyfin]
      summary: Get Jellyfin configuration status
      responses:
        "200":
          description: Jellyfin configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinConfig"
    patch:
      operationId: updateJellyfinConfig
      tags: [jellyfin]
      summary: Update Jellyfin configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JellyfinConfigUpdate"
      responses:
        "200":
          description: Updated Jellyfin configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinConfig"
  /jellyfin/test-connection:
    post:
      operationId: testJellyfinConnection
      tags: [jellyfin]
      summary: Verify the configured Jellyfin server
      responses:
        "200":
          description: Actual Jellyfin connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinConfig"
  /jellyfin/sync:
    post:
      operationId: startJellyfinSync
      tags: [jellyfin]
      summary: Start synchronizing the configured Jellyfin inventory
      responses:
        "202":
          description: Jellyfin synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinConfig"
  /jellyfin/inventory:
    get:
      operationId: getJellyfinInventory
      tags: [jellyfin]
      summary: Get the synchronized Jellyfin inventory
      responses:
        "200":
          description: Owner-scoped Jellyfin libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JellyfinInventory"
  /archive/provider:
    get:
      operationId: getArchiveProvider
      tags: [archive]
      summary: Get the active archive reference provider
      responses:
        "200":
          description: The media server currently supplying reference inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveProviderSelection"
    put:
      operationId: setArchiveProvider
      tags: [archive]
      summary: Select the archive reference provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveProviderSelectionUpdate"
      responses:
        "200":
          description: The updated reference provider selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveProviderSelection"
  /integrations/status:
    get:
      operationId: getIntegrationStatuses
      tags: [integrations]
      summary: Get external integration adapter status
      responses:
        "200":
          description: Configured, reachable, and operational adapter states without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
  /integrations/webhooks:
    get:
      operationId: getWebhookSecretStatuses
      tags: [integrations]
      summary: Get provider webhook secret status without credentials
      responses:
        "200":
          description: Provider webhook configuration and active overlap windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretStatusesResponse"
  /integrations/webhooks/history:
    get:
      operationId: getWebhookDeliveryHistory
      tags: [integrations]
      summary: Get owner-scoped webhook delivery history
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WebhookProvider"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated webhook delivery classifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryHistoryResponse"
  /integrations/webhooks/{provider}:
    put:
      operationId: replaceWebhookSecret
      tags: [integrations]
      summary: Replace a provider webhook secret
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [sonarr, radarr]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretBody"
      responses:
        "200":
          description: Updated provider webhook status without the secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretStatus"
        "400":
          description: Invalid webhook secret or rotation request
        "404":
          description: Unsupported provider
  /acquisition-jobs:
    get:
      operationId: getAcquisitionJobs
      tags: [acquisition]
      summary: List owner-scoped acquisition jobs
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AcquisitionJobState"
      responses:
