openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Local system status and diagnostics
  - name: settings
    description: Local application settings
  - name: plex
    description: Plex connection configuration
  - name: media
    description: Local media inspection and source selection
  - name: downloads
    description: Persistent local download jobs
  - name: archive
    description: Local archive inventory and media intelligence
paths:
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List owner-scoped status and implemented, planned, and available capabilities
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationDescriptor"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "404":
          description: Unknown integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "409":
          description: Capability disabled, unsupported, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "503":
          description: Integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
  /integrations/{integrationId}/config:
    patch:
      operationId: updateIntegrationConfig
      tags: [integrations]
      summary: Set owner-scoped enablement; provider credentials remain on existing provider configuration endpoints
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationConfigUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDescriptor"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "404":
          description: Unknown integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "409":
          description: Capability disabled, unsupported, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "503":
          description: Integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
  /integrations/{integrationId}/test-connection:
    post:
      operationId: testIntegrationConnection
      tags: [integrations]
      summary: Explicitly check connection; disabled and unconfigured providers perform no network work
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDescriptor"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "404":
          description: Unknown integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "409":
          description: Capability disabled, unsupported, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "503":
          description: Integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
  /integrations/{integrationId}/inventory:
    get:
      operationId: getIntegrationInventory
      tags: [integrations]
      summary: Read normalized cached inventory without contacting external services
      parameters:
        - in: path
          name: integrationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationInventory"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "404":
          description: Unknown integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "409":
          description: Capability disabled, unsupported, or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
        "503":
          description: Integration unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Get archive system overview
      responses:
        "200":
          description: Current system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      tags: [system]
      summary: Detect optional local dependencies
      responses:
        "200":
          description: Detected dependency statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyStatus"
  /system/events:
    get:
      operationId: getSystemEvents
      tags: [system]
      summary: Get recent system events
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /plex/config:
    get:
      operationId: getPlexConfig
      tags: [plex]
      summary: Get Plex configuration status
      responses:
        "200":
          description: Plex configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
    patch:
      operationId: updatePlexConfig
      tags: [plex]
      summary: Update Plex configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConfigUpdate"
      responses:
        "200":
          description: Updated Plex configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/test-connection:
    post:
      operationId: testPlexConnection
      tags: [plex]
      summary: Verify the configured Plex server
      responses:
        "200":
          description: Actual Plex connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/sync:
    post:
      operationId: startPlexSync
      tags: [plex]
      summary: Start synchronizing the configured Plex inventory
      responses:
        "202":
          description: Plex synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/inventory:
    get:
      operationId: getPlexInventory
      tags: [plex]
      summary: Get the synchronized Plex inventory
      responses:
        "200":
          description: Owner-scoped Plex libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexInventory"
  /archive/scan:
    get:
      operationId: getArchiveScan
      tags: [archive]
      summary: Get the current local archive scan state
      responses:
        "200":
          description: Owner-scoped archive scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
    post:
      operationId: startArchiveScan
      tags: [archive]
      summary: Start a server-side archive filesystem scan
      responses:
        "202":
          description: Archive scan started or already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
  /archive/inventory:
    get:
      operationId: getArchiveInventory
      tags: [archive]
      summary: Get local archive inventory and intelligence
      responses:
        "200":
          description: Owner-scoped local files and Plex comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventory"
  /archive/naming-proposals:
    get:
      operationId: getArchiveNamingProposals
      tags: [archive]
      summary: Get archive naming proposals
      parameters:
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
        - name: confidence
          in: query
          schema:
            type: string
            enum: [high, medium, low, uncertain]
        - name: operation
          in: query
          schema:
            type: string
            enum: [rename, restructure, move, uncertain/no_action]
        - name: pattern
          in: query
          schema:
            type: string
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, tv]
        - name: volume
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [actionable, uncertain]
        - name: uncertain
          in: query
          schema:
            type: boolean
        - name: decision
          in: query
          schema:
            type: string
            enum: [accepted, rejected, deferred, unreviewed]
      responses:
        "200":
          description: Archive naming proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveNamingProposalResponse"
  /archive/naming-proposals/decisions:
    post:
      operationId: updateArchiveNamingProposalDecisions
      tags: [archive]
      summary: Save durable decisions for archive naming proposals
      description: |
        Persists accepted/rejected/deferred decisions tied to the exact proposal
        evidence (including the source file's size and modification time). When
        the underlying evidence changes, the stored decision no longer matches
        and the proposal reopens as unreviewed instead of silently remaining
        accepted. Only proposals with an executable, collision-free destination
        can be accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveNamingProposalDecisionsBody"
      responses:
        "200":
          description: Per-proposal decision outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveNamingProposalDecisionsResponse"
        "400":
          description: Decision input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/naming-proposals/apply:
    post:
      operationId: applyArchiveNamingProposals
      tags: [archive]
      summary: Apply accepted archive naming proposals through the mutation journal
      description: |
        Applies a bounded batch of naming proposals. Every item must currently
        be accepted against matching evidence, must have an executable
        collision-free destination, and is re-validated at apply time: paths
        are confined to configured archive volumes, traversal is rejected, and
        an existing target aborts that item (files are never overwritten).
        Destructive phases only run through the archive operation journal,
        which records state transitions and enables rollback. With `dryRun`
        the same gates and checks run without any filesystem or journal write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveNamingProposalApplyBody"
      responses:
        "200":
          description: Per-proposal apply outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveNamingProposalApplyResponse"
        "400":
          description: Apply input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/operations:
    get:
      operationId: getArchiveOperations
      tags: [archive]
      summary: List recent archive mutation operations
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Owner-scoped archive operations, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchiveOperation"
  /archive/operations/{id}/rollback:
    post:
      operationId: rollbackArchiveOperation
      tags: [archive]
      summary: Roll back a successful archive operation using its journal entry
      description: |
        Restores the original path only when the moved file still exists at
        the recorded destination and the original path is free again. Any
        other condition refuses the rollback without touching files.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: The operation after rollback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveOperation"
        "400":
          description: Rollback is not possible for this operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive operation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/records/{id}:
    get:
      operationId: getArchiveRecord
      tags: [archive]
      summary: Get one local archive record with comparison details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Archive record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventoryRecord"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArchiveRecordReview
      tags: [archive]
      summary: Save a non-destructive review decision for an archive finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: Review is not valid for the current finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/reviews:
    post:
      operationId: updateArchiveRecordReviews
      tags: [archive]
      summary: Save one review decision for several archive findings
      description: |
        Applies the selected status and one optional shared note to each archive
        finding in `ids`. The note is persisted independently for every
        successful result. Sending `null` clears an existing note; omitting the
        property has the same effect at the API boundary. The Archive UI
        currently sends `null` because bulk note entry is not exposed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveBulkReviewUpdate"
      responses:
        "200":
          description: Per-record bulk review outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveBulkReviewResponse"
        "400":
          description: Bulk review input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/quality/findings:
    get:
      operationId: getArchiveQualityFindings
      tags: [archive]
      summary: Get derived technical quality findings for the local archive
      description: |
        Read-only findings produced by the quality intelligence layer: exact and
        probable duplicates, lower-quality duplicates, superior encodes,
        materially different encodes, and conflicting or missing technical
        metadata. Nothing here deletes, moves, or replaces media; every finding
        carries `action: review_only`.
      parameters:
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
        - name: kind
          in: query
          schema:
            type: string
            enum: [exact_duplicate, probable_duplicate, lower_quality_duplicate, superior_encode, materially_different_encode, conflicting_quality_metadata, missing_technical_metadata]
        - name: confidence
          in: query
          schema:
            type: string
            enum: [high, medium, low]
        - name: reviewStatus
          in: query
          schema:
            type: string
            enum: [unreviewed, reviewed, deferred, unresolved]
        - name: fileRecordId
          in: query
          schema:
            type: number
            minimum: 1
        - name: volume
          in: query
          schema:
            type: string
        - name: includeReviewed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Quality findings with summary counts and pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveQualityFindingResponse"
  /archive/quality/records/{id}:
    get:
      operationId: getArchiveQualityRecord
      tags: [archive]
      summary: Get the normalized quality model and comparisons for one archive record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Quality report for the record, including comparisons against sibling encodes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveQualityRecordReport"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/quality/findings/review:
    post:
      operationId: updateArchiveQualityFindingReview
      tags: [archive]
      summary: Save a non-destructive review decision for one quality finding
      description: |
        Reviews are keyed by owner, file record, finding kind, and the finding's
        deterministic evidence key. Saving a decision writes only to
        `archive_review`; media files and file records are never modified. If the
        underlying evidence changes later, the evidence key changes and the
        finding reopens while the previous decision remains as history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveQualityFindingReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: The finding locator is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such finding for the current evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/findings:
    get:
      operationId: getAcquisitionFindings
      tags: [acquisition]
      summary: List owner-scoped acquisition intelligence findings
      parameters:
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, tv]
        - name: status
          in: query
          schema:
            type: string
            enum: [recommended, not_recommended]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, normal, low]
        - name: reviewStatus
          in: query
          schema:
            type: string
            enum: [unreviewed, reviewed, deferred, dismissed]
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Acquisition findings and normalized recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFindingResponse"
  /acquisition/findings/{id}:
    get:
      operationId: getAcquisitionFinding
      tags: [acquisition]
      summary: Inspect one acquisition recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Acquisition recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFinding"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/findings/{id}/review:
    patch:
      operationId: updateAcquisitionFindingReview
      tags: [acquisition]
      summary: Save a non-destructive acquisition finding review decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionReviewUpdate"
      responses:
        "200":
          description: Updated acquisition finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFinding"
  /acquisition/refresh:
    post:
      operationId: refreshAcquisitionIntelligence
      tags: [acquisition]
      summary: Recompute acquisition findings from normalized local capabilities
      responses:
        "200":
          description: Recompute summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionRefreshResponse"
  /acquisition/candidates:
    post:
      operationId: upsertAcquisitionCandidate
      tags: [acquisition]
      summary: Register a normalized source option from a future adapter
      description: This stores an abstract candidate only. It does not contact a provider or create a download job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionCandidateInput"
      responses:
        "201":
          description: Candidate stored without acquisition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionSourceOption"
  /acquisition/plans:
    post:
      operationId: createAcquisitionPlan
      tags: [acquisition]
      summary: Build a provider-neutral acquisition plan from a supplied source URL
      description: |
        Inspects the supplied URL through the yt-dlp inspection path (including
        playlist entries), normalizes discovered media into candidates, resolves
        them against the local archive identity, and produces a canonical
        AcquisitionPlan with trust, quality, storage, and destination facts.
        Nothing is downloaded: an untrusted source stays untrusted until it is
        explicitly approved through the approval endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionPlanRequest"
      responses:
        "201":
          description: The built acquisition plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlan"
        "400":
          description: The request or source URL is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listAcquisitionPlans
      tags: [acquisition]
      summary: List owner-scoped acquisition plans
      responses:
        "200":
          description: Acquisition plans, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlanListResponse"
  /acquisition/plans/{id}:
    get:
      operationId: getAcquisitionPlan
      tags: [acquisition]
      summary: Read one acquisition plan with live per-item execution state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: The acquisition plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/plans/{id}/approve:
    post:
      operationId: approveAcquisitionPlan
      tags: [acquisition]
      summary: Approve an acquisition plan (the trust boundary for untrusted sources)
      description: |
        An untrusted, explicitly user-supplied source is never executed
        silently. Approval is an explicit, recorded decision that transitions
        the source trust to user_approved. Blocked and unsupported sources
        cannot be approved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionPlanApprovalInput"
      responses:
        "200":
          description: The approved plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The source is blocked, unsupported, or the plan was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/plans/{id}/reject:
    post:
      operationId: rejectAcquisitionPlan
      tags: [acquisition]
      summary: Reject an acquisition plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionPlanApprovalInput"
      responses:
        "200":
          description: The rejected plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/plans/{id}/execute:
    post:
      operationId: executeAcquisitionPlan
      tags: [acquisition]
      summary: Execute an approved plan as a bounded batch through the real download engine
      description: |
        Requires an approved plan. Queues at most a bounded batch of items
        through the real yt-dlp download engine (FFmpeg processing and FFprobe
        verification included). Never executes untrusted, blocked, or
        unsupported sources.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: The plan with per-item execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The plan is not approved, or nothing is left to execute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/inspect:
    post:
      operationId: inspectMediaSource
      tags: [media]
      summary: Inspect a media URL without downloading it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInspectInput"
      responses:
        "200":
          description: Normalized media metadata and formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInspection"
        "400":
          description: Source could not be inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/local-inspect:
    post:
      operationId: inspectLocalMedia
      tags: [media]
      summary: Inspect a local media file with FFprobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalMediaInspectInput"
      responses:
        "200":
          description: Local media inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMediaInspection"
  /media/prepare-download:
    post:
      operationId: prepareDownload
      tags: [media]
      summary: Create a validated download specification without starting a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPreparationInput"
      responses:
        "200":
          description: Prepared download specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSpecification"
  /downloads:
    get:
      operationId: getDownloads
      tags: [downloads]
      summary: List persistent download jobs
      responses:
        "200":
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Create a persistent download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadJobInput"
      responses:
        "201":
          description: Created download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/events:
    get:
      operationId: streamDownloadEvents
      tags: [downloads]
      summary: Stream download and processing updates
      responses:
        "200":
          description: Server-sent download events
          content:
            text/event-stream:
              schema:
                type: string
  /downloads/{id}:
    get:
      operationId: getDownload
      tags: [downloads]
      summary: Get one download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: Delete a non-running download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204":
          description: Deleted
  /downloads/{id}/start:
    post:
      operationId: startDownload
      tags: [downloads]
      summary: Start a queued or recoverable download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Started download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/pause:
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pause a running download where supported
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Paused or safely stopped for resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/resume:
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resume a paused or recoverable download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Resumed download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/cancel:
    post:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancel a running download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Cancelled download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      tags: [downloads]
      summary: Retry a failed download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Retried download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
components:
  parameters:
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    AcquisitionTechnicalQuality:
      type: object
      required: [height, hdr, videoCodec, bitrate, audioCodec, audioChannels, container]
      properties:
        height:
          type: [number, "null"]
        hdr:
          type: boolean
        videoCodec:
          type: [string, "null"]
        bitrate:
          type: [number, "null"]
        audioCodec:
          type: [string, "null"]
        audioChannels:
          type: [number, "null"]
        container:
          type: [string, "null"]
    AcquisitionAvailability:
      type: object
      required: [state, provider, discoveredTitle, discoveredId, sourceConfidence, checkedAt]
      properties:
        state:
          type: string
          enum: [unavailable, available, unknown]
        provider:
          type: string
        discoveredTitle:
          type: [string, "null"]
        discoveredId:
          type: [string, "null"]
        sourceConfidence:
          type: number
          minimum: 0
          maximum: 1
        checkedAt:
          type: [string, "null"]
    AcquisitionIdentity:
      type: object
      required: [key, title, mediaType, year, show, season, episode, confidence]
      properties:
        key:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        year:
          type: [number, "null"]
        show:
          type: [string, "null"]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionNeed:
      type: object
      required: [identity, scope, archiveState, presentCount, expectedCount, observedCount, archiveQuality, archiveSizeBytes, preferredQuality]
      properties:
        identity:
          $ref: "#/components/schemas/AcquisitionIdentity"
        scope:
          type: string
          enum: [movie, episode, season]
        archiveState:
          type: string
          enum: [fully_present, partially_present, missing, present_lower_quality, uncertain]
        presentCount:
          type: number
          minimum: 0
        expectedCount:
          type: number
          minimum: 1
        observedCount:
          type: number
          minimum: 0
        archiveQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        archiveSizeBytes:
          type: number
          minimum: 0
        preferredQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
    AcquisitionSourceOption:
      type: object
      required: [id, provider, title, mediaType, scope, season, episode, quality, estimatedSizeBytes, availability, confidence]
      properties:
        id:
          oneOf:
            - type: number
            - type: string
        provider:
          type: string
        sourceKey:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        scope:
          type: string
          enum: [movie, episode, season]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        estimatedSizeBytes:
          type: [number, "null"]
        availability:
          $ref: "#/components/schemas/AcquisitionAvailability"
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionStorageImpact:
      type: object
      required: [estimatedBytes, freeBytesBefore, freeBytesAfter, status, summary]
      properties:
        estimatedBytes:
          type: [number, "null"]
        freeBytesBefore:
          type: [number, "null"]
        freeBytesAfter:
          type: [number, "null"]
        status:
          type: string
          enum: [sufficient, insufficient, unknown]
        summary:
          type: string
    AcquisitionRecommendation:
      type: object
      required: [status, priority, reason, candidateSources, expectedQuality, expectedStorageImpact, confidence, blockingReasons, archiveState]
      properties:
        status:
          type: string
          enum: [recommended, not_recommended]
        priority:
          type: string
          enum: [high, normal, low]
        reason:
          type: string
        candidateSources:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionSourceOption"
        expectedQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        expectedStorageImpact:
          $ref: "#/components/schemas/AcquisitionStorageImpact"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        blockingReasons:
          type: array
          items:
            type: string
        archiveState:
          type: string
          enum: [fully_present, partially_present, missing, present_lower_quality, uncertain]
    AcquisitionReview:
      type: object
      required: [status, note, updatedAt]
      properties:
        status:
          type: string
          enum: [unreviewed, reviewed, deferred, dismissed]
        note:
          type: [string, "null"]
        updatedAt:
          type: string
    AcquisitionFinding:
      type: object
      required: [id, need, recommendation, review, computedAt]
      properties:
        id:
          type: number
        need:
          $ref: "#/components/schemas/AcquisitionNeed"
        recommendation:
          $ref: "#/components/schemas/AcquisitionRecommendation"
        review:
          $ref: "#/components/schemas/AcquisitionReview"
        computedAt:
          type: string
    AcquisitionFindingSummary:
      type: object
      required: [total, recommended, blocked, highPriority]
      properties:
        total:
          type: number
          minimum: 0
        recommended:
          type: number
          minimum: 0
        blocked:
          type: number
          minimum: 0
        highPriority:
          type: number
          minimum: 0
    AcquisitionFindingPagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: number
          minimum: 1
        pageSize:
          type: number
          minimum: 1
        total:
          type: number
          minimum: 0
        totalPages:
          type: number
          minimum: 0
    AcquisitionFindingResponse:
      type: object
      required: [summary, pagination, results]
      properties:
        summary:
          $ref: "#/components/schemas/AcquisitionFindingSummary"
        pagination:
          $ref: "#/components/schemas/AcquisitionFindingPagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionFinding"
    AcquisitionRefreshResponse:
      type: object
      required: [computedAt, findingCount, recommendedCount, blockedCount]
      properties:
        computedAt:
          type: string
        findingCount:
          type: number
          minimum: 0
        recommendedCount:
          type: number
          minimum: 0
        blockedCount:
          type: number
          minimum: 0
    AcquisitionCandidateInput:
      type: object
      required: [identityKey, title, mediaType, scope, provider, availabilityState]
      properties:
        identityKey:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        scope:
          type: string
          enum: [movie, episode, season]
        year:
          type: [number, "null"]
        show:
          type: [string, "null"]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        provider:
          type: string
        sourceKey:
          type: string
        discoveredId:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        estimatedSizeBytes:
          type: [number, "null"]
        availabilityState:
          type: string
          enum: [unavailable, available, unknown]
        sourceConfidence:
          type: number
          minimum: 0
          maximum: 1
        checkedAt:
          type: [string, "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionReviewUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unreviewed, reviewed, deferred, dismissed]
        note:
          type: [string, "null"]
          maxLength: 500
    AcquisitionPlanRequest:
      type: object
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          minLength: 1
        note:
          type: [string, "null"]
          maxLength: 2000
          description: The natural-language request that motivated this plan.
        mediaType:
          type: [string, "null"]
          enum: [movie, tv]
        maxItems:
          type: [number, "null"]
          minimum: 1
          maximum: 50
    AcquisitionPlanApprovalInput:
      type: object
      properties:
        note:
          type: [string, "null"]
          maxLength: 500
    AcquisitionSourceTrust:
      type: object
      required: [state, reason, requiresApproval]
      properties:
        state:
          type: string
          enum: [trusted, user_approved, untrusted, unsupported, blocked]
        reason:
          type: string
        requiresApproval:
          type: boolean
    AcquisitionPlanCandidate:
      type: object
      required: [entryUrl, title, identityKey, mediaType, scope]
      properties:
        entryUrl:
          type: string
        title:
          type: string
        identityKey:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        scope:
          type: string
          enum: [movie, episode, season]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        year:
          type: [number, "null"]
        selectedFormatId:
          type: [string, "null"]
        quality:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
        estimatedSizeBytes:
          type: [number, "null"]
    AcquisitionPlanArchiveState:
      type: object
      required: [identityKey, presentCount, archiveSizeBytes]
      properties:
        identityKey:
          type: string
        presentCount:
          type: number
        archiveQuality:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
        archiveSizeBytes:
          type: number
    AcquisitionPlanQualityComparison:
      type: object
      required: [identityKey, candidateRank, verdict, summary]
      properties:
        identityKey:
          type: string
        candidateRank:
          type: number
        archiveRank:
          type: [number, "null"]
        verdict:
          type: string
          enum: [new_item, upgrade, lateral_or_worse]
        summary:
          type: string
    AcquisitionPlanDestination:
      type: object
      required: [identityKey, volumeLabel, destinationDirectory, finalFilename, mediaType]
      properties:
        identityKey:
          type: string
        volumeId:
          type: [string, "null"]
        volumeLabel:
          type: string
        destinationDirectory:
          type: string
        finalFilename:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
    AcquisitionPlanStorageImpact:
      type: object
      required: [status, summary]
      properties:
        estimatedBytes:
          type: [number, "null"]
        freeBytesBefore:
          type: [number, "null"]
        freeBytesAfter:
          type: [number, "null"]
        status:
          type: string
          enum: [ok, insufficient, unknown]
        summary:
          type: string
    AcquisitionPlanItem:
      type: object
      required: [identityKey, title, state]
      properties:
        identityKey:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [planned, queued, downloading, processing, verifying, downloading_more, complete, placed, failed, already_present, skipped]
        downloadJobId:
          type: [number, "null"]
        error:
          type: [string, "null"]
        destinationPath:
          type: [string, "null"]
    AcquisitionPlan:
      type: object
      required: [id, request, suppliedSource, sourceTrust, discoveredCandidates, existingArchiveState, missingItems, alreadyPresentItems, preferredCandidates, qualityComparison, storageImpact, approvalState, executionStrategy, destinationPlan, integrationAlternatives, items]
      properties:
        id:
          type: number
        request:
          type: object
          required: [sourceUrl, requestedAt]
          properties:
            sourceUrl:
              type: string
            note:
              type: [string, "null"]
            mediaType:
              type: [string, "null"]
              enum: [movie, tv]
            requestedAt:
              type: string
        suppliedSource:
          type: object
          required: [url, title, kind]
          properties:
            url:
              type: string
            extractor:
              type: [string, "null"]
            title:
              type: string
            kind:
              type: string
              enum: [url]
        sourceTrust:
          $ref: "#/components/schemas/AcquisitionSourceTrust"
        discoveredCandidates:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanCandidate"
        existingArchiveState:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanArchiveState"
        missingItems:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanCandidate"
        alreadyPresentItems:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanCandidate"
        preferredCandidates:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanCandidate"
        qualityComparison:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanQualityComparison"
        storageImpact:
          $ref: "#/components/schemas/AcquisitionPlanStorageImpact"
        approvalState:
          type: string
          enum: [pending, approved, rejected]
        approvalNote:
          type: [string, "null"]
        executionStrategy:
          type: object
          required: [mode, batchLimit, perItem]
          properties:
            mode:
              type: string
              enum: [staged_download]
            batchLimit:
              type: number
            perItem:
              type: string
              enum: [download_then_ffmpeg_then_ffprobe_verify]
        destinationPlan:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanDestination"
        integrationAlternatives:
          type: array
          items:
            type: object
            required: [provider, capability, available]
            properties:
              provider:
                type: string
              capability:
                type: string
              available:
                type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlanItem"
        finalResults:
          oneOf:
            - type: "null"
            - type: object
              required: [placedCount, failedCount, alreadyPresentCount, perItem]
              properties:
                placedCount:
                  type: number
                failedCount:
                  type: number
                alreadyPresentCount:
                  type: number
                perItem:
                  type: array
                  items:
                    $ref: "#/components/schemas/AcquisitionPlanItem"
    AcquisitionPlanListResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionPlan"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ArchiveNamingProposalIdentity:
      type: object
      additionalProperties: true
      description: |
        Parsed or proposed media identity. Movie identities contain title and
        year fields; TV identities contain show, season, episode, episodes,
        episodeTitle, and ambiguity fields.

    ArchiveNamingProposal:
      type: object
      required:
        - fileRecordId
        - localIdentityId
        - sourcePath
        - proposedPath
        - sourceFilename
        - proposedFilename
        - currentIdentity
        - proposedIdentity
        - patternId
        - confidence
        - operation
        - reason
        - evidence
        - mediaType
        - volumeId
        - archiveRoot
        - collision
        - sizeBytes
        - modifiedAtMs
        - evidenceKey
        - decisionStatus
        - decisionNote
        - decisionUpdatedAt
        - decisionStale
      properties:
        fileRecordId:
          type: number

        localIdentityId:
          type: [number, "null"]

        sourcePath:
          type: string

        proposedPath:
          type: [string, "null"]

        sourceFilename:
          type: string

        proposedFilename:
          type: [string, "null"]

        currentIdentity:
          oneOf:
            - $ref: "#/components/schemas/ArchiveNamingProposalIdentity"
            - type: "null"

        proposedIdentity:
          oneOf:
            - $ref: "#/components/schemas/ArchiveNamingProposalIdentity"
            - type: "null"

        patternId:
          type: string

        confidence:
          type: string
          enum: [high, medium, low, uncertain]

        operation:
          type: string
          enum: [rename, restructure, move, uncertain/no_action]

        reason:
          type: string

        evidence:
          type: array
          items:
            type: string

        mediaType:
          type: string
          enum: [movie, tv]

        volumeId:
          type: string

        archiveRoot:
          type: string

        collision:
          type: boolean

        sizeBytes:
          type: [number, "null"]

        modifiedAtMs:
          type: [number, "null"]

        evidenceKey:
          type: string
          description: |
            SHA-256 over the evidence this proposal was derived from (source
            path, filename, size, mtime, pattern, confidence, operation, and
            destination). Decisions and applies are bound to this key.

        decisionStatus:
          type: string
          enum: [accepted, rejected, deferred, unreviewed]
          description: |
            The durable decision that currently matches this proposal's
            evidence. A stored decision whose evidence key no longer matches
            reads back as `unreviewed` (the proposal reopens for review).

        decisionNote:
          type: [string, "null"]

        decisionUpdatedAt:
          type: [string, "null"]

        decisionStale:
          type: boolean
          description: True when a decision exists but was made against superseded evidence.

    ArchiveNamingProposalSummary:
      type: object
      required:
        - total
        - highConfidence
        - mediumConfidence
        - lowConfidence
        - actionable
        - uncertain
        - collisions
        - acceptedCount
        - rejectedCount
        - deferredCount
        - staleDecisionCount
      properties:
        total:
          type: number
          minimum: 0

