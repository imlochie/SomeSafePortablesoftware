      type: object
      required: [fileRecordIds]
      properties:
        fileRecordIds:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          description: |
            Bounded batch of file_record ids whose accepted naming proposals
            should be applied. A single apply request touches at most 25 files.
          items:
            type: number
            minimum: 1
        dryRun:
          type: boolean
          default: false
          description: |
            When true, every gate (accepted decision, executable destination,
            path confinement, collision, source-freshness) is evaluated but no
            filesystem or journal write happens.
    ArchiveOperation:
      type: object
      description: |
        Durable, owner-scoped journal entry for one filesystem mutation.
        Source and target are confined to configured archive volumes; the
        evidence snapshot plus expected size/mtime make the change auditable,
        and successful entries carry enough information to roll the mutation
        back.
      required:
        - id
        - kind
        - status
        - sourcePath
        - targetPath
        - fileRecordId
        - sourceEvidenceKey
        - proposalEvidence
        - expectedSizeBytes
        - expectedModifiedAtMs
        - createdDirectories
        - error
        - appliedAt
        - rolledBackAt
        - rollbackAvailable
        - createdAt
        - updatedAt
      properties:
        id:
          type: number
        kind:
          type: string
          enum: [rename, move, restructure]
        status:
          type: string
          enum: [proposed, approved, queued, running, succeeded, failed, rolled_back]
        sourcePath:
          type: string
        targetPath:
          type: string
        fileRecordId:
          type: [number, "null"]
        sourceEvidenceKey:
          type: [string, "null"]
        proposalEvidence:
          type: object
          additionalProperties: true
        expectedSizeBytes:
          type: [number, "null"]
        expectedModifiedAtMs:
          type: [number, "null"]
        createdDirectories:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]
        appliedAt:
          type: [string, "null"]
        rolledBackAt:
          type: [string, "null"]
        rollbackAvailable:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    ArchiveOperationCheck:
      type: object
