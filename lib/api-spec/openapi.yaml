openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Local system status and diagnostics
  - name: settings
    description: Local application settings
  - name: plex
    description: Plex connection configuration
  - name: media
    description: Local media inspection and source selection
  - name: downloads
    description: Persistent local download jobs
  - name: archive
    description: Local archive inventory and media intelligence
  - name: acquisition
    description: Provider-neutral acquisition intelligence and review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Get archive system overview
      responses:
        "200":
          description: Current system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      tags: [system]
      summary: Detect optional local dependencies
      responses:
        "200":
          description: Detected dependency statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyStatus"
  /system/events:
    get:
      operationId: getSystemEvents
      tags: [system]
      summary: Get recent system events
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /plex/config:
    get:
      operationId: getPlexConfig
      tags: [plex]
      summary: Get Plex configuration status
      responses:
        "200":
          description: Plex configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
    patch:
      operationId: updatePlexConfig
      tags: [plex]
      summary: Update Plex configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConfigUpdate"
      responses:
        "200":
          description: Updated Plex configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/test-connection:
    post:
      operationId: testPlexConnection
      tags: [plex]
      summary: Verify the configured Plex server
      responses:
        "200":
          description: Actual Plex connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/sync:
    post:
      operationId: startPlexSync
      tags: [plex]
      summary: Start synchronizing the configured Plex inventory
      responses:
        "202":
          description: Plex synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/inventory:
    get:
      operationId: getPlexInventory
      tags: [plex]
      summary: Get the synchronized Plex inventory
      responses:
        "200":
          description: Owner-scoped Plex libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexInventory"
  /archive/scan:
    get:
      operationId: getArchiveScan
      tags: [archive]
      summary: Get the current local archive scan state
      responses:
        "200":
          description: Owner-scoped archive scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
    post:
      operationId: startArchiveScan
      tags: [archive]
      summary: Start a server-side archive filesystem scan
      responses:
        "202":
          description: Archive scan started or already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
  /archive/inventory:
    get:
      operationId: getArchiveInventory
      tags: [archive]
      summary: Get local archive inventory and intelligence
      responses:
        "200":
          description: Owner-scoped local files and Plex comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventory"
  /archive/naming-proposals:
    get:
      operationId: getArchiveNamingProposals
      tags: [archive]
      summary: Get archive naming proposals
      parameters:
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
        - name: confidence
          in: query
          schema:
            type: string
            enum: [high, medium, low, uncertain]
        - name: operation
          in: query
          schema:
            type: string
            enum: [rename, restructure, move, uncertain/no_action]
        - name: pattern
          in: query
          schema:
            type: string
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, tv]
        - name: volume
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [actionable, uncertain]
        - name: uncertain
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Archive naming proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveNamingProposalResponse"
  /archive/records/{id}:
    get:
      operationId: getArchiveRecord
      tags: [archive]
      summary: Get one local archive record with comparison details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Archive record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventoryRecord"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArchiveRecordReview
      tags: [archive]
      summary: Save a non-destructive review decision for an archive finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: Review is not valid for the current finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/reviews:
    post:
      operationId: updateArchiveRecordReviews
      tags: [archive]
      summary: Save one review decision for several archive findings
      description: |
        Applies the selected status and one optional shared note to each archive
        finding in `ids`. The note is persisted independently for every
        successful result. Sending `null` clears an existing note; omitting the
        property has the same effect at the API boundary. The Archive UI
        currently sends `null` because bulk note entry is not exposed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveBulkReviewUpdate"
      responses:
        "200":
          description: Per-record bulk review outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveBulkReviewResponse"
        "400":
          description: Bulk review input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/findings:
    get:
      operationId: getAcquisitionFindings
      tags: [acquisition]
      summary: List owner-scoped acquisition intelligence findings
      parameters:
        - name: mediaType
          in: query
          schema:
            type: string
            enum: [movie, tv]
        - name: status
          in: query
          schema:
            type: string
            enum: [recommended, not_recommended]
        - name: priority
          in: query
          schema:
            type: string
            enum: [high, normal, low]
        - name: reviewStatus
          in: query
          schema:
            type: string
            enum: [unreviewed, reviewed, deferred, dismissed]
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Acquisition findings and normalized recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFindingResponse"
  /acquisition/findings/{id}:
    get:
      operationId: getAcquisitionFinding
      tags: [acquisition]
      summary: Inspect one acquisition recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Acquisition recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFinding"
        "404":
          description: Finding not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition/findings/{id}/review:
    patch:
      operationId: updateAcquisitionFindingReview
      tags: [acquisition]
      summary: Save a non-destructive acquisition finding review decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionReviewUpdate"
      responses:
        "200":
          description: Updated acquisition finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionFinding"
  /acquisition/refresh:
    post:
      operationId: refreshAcquisitionIntelligence
      tags: [acquisition]
      summary: Recompute acquisition findings from normalized local capabilities
      responses:
        "200":
          description: Recompute summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionRefreshResponse"
  /acquisition/candidates:
    post:
      operationId: upsertAcquisitionCandidate
      tags: [acquisition]
      summary: Register a normalized source option from a future adapter
      description: This stores an abstract candidate only. It does not contact a provider or create a download job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcquisitionCandidateInput"
      responses:
        "201":
          description: Candidate stored without acquisition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionSourceOption"
  /media/inspect:
    post:
      operationId: inspectMediaSource
      tags: [media]
      summary: Inspect a media URL without downloading it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInspectInput"
      responses:
        "200":
          description: Normalized media metadata and formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInspection"
        "400":
          description: Source could not be inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/local-inspect:
    post:
      operationId: inspectLocalMedia
      tags: [media]
      summary: Inspect a local media file with FFprobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalMediaInspectInput"
      responses:
        "200":
          description: Local media inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMediaInspection"
  /media/prepare-download:
    post:
      operationId: prepareDownload
      tags: [media]
      summary: Create a validated download specification without starting a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPreparationInput"
      responses:
        "200":
          description: Prepared download specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSpecification"
  /downloads:
    get:
      operationId: getDownloads
      tags: [downloads]
      summary: List persistent download jobs
      responses:
        "200":
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Create a persistent download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadJobInput"
      responses:
        "201":
          description: Created download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/events:
    get:
      operationId: streamDownloadEvents
      tags: [downloads]
      summary: Stream download and processing updates
      responses:
        "200":
          description: Server-sent download events
          content:
            text/event-stream:
              schema:
                type: string
  /downloads/{id}:
    get:
      operationId: getDownload
      tags: [downloads]
      summary: Get one download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: Delete a non-running download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204":
          description: Deleted
  /downloads/{id}/start:
    post:
      operationId: startDownload
      tags: [downloads]
      summary: Start a queued or recoverable download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Started download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/pause:
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pause a running download where supported
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Paused or safely stopped for resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/resume:
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resume a paused or recoverable download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Resumed download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/cancel:
    post:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancel a running download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Cancelled download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      tags: [downloads]
      summary: Retry a failed download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Retried download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
components:
  parameters:
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AcquisitionTechnicalQuality:
      type: object
      required: [height, hdr, videoCodec, bitrate, audioCodec, audioChannels, container]
      properties:
        height:
          type: [number, "null"]
        hdr:
          type: boolean
        videoCodec:
          type: [string, "null"]
        bitrate:
          type: [number, "null"]
        audioCodec:
          type: [string, "null"]
        audioChannels:
          type: [number, "null"]
        container:
          type: [string, "null"]
    AcquisitionAvailability:
      type: object
      required: [state, provider, discoveredTitle, discoveredId, sourceConfidence, checkedAt]
      properties:
        state:
          type: string
          enum: [unavailable, available, unknown]
        provider:
          type: string
        discoveredTitle:
          type: [string, "null"]
        discoveredId:
          type: [string, "null"]
        sourceConfidence:
          type: number
          minimum: 0
          maximum: 1
        checkedAt:
          type: [string, "null"]
    AcquisitionIdentity:
      type: object
      required: [key, title, mediaType, year, show, season, episode, confidence]
      properties:
        key:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        year:
          type: [number, "null"]
        show:
          type: [string, "null"]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionNeed:
      type: object
      required: [identity, scope, archiveState, presentCount, expectedCount, observedCount, archiveQuality, archiveSizeBytes, preferredQuality]
      properties:
        identity:
          $ref: "#/components/schemas/AcquisitionIdentity"
        scope:
          type: string
          enum: [movie, episode, season]
        archiveState:
          type: string
          enum: [fully_present, partially_present, missing, present_lower_quality, uncertain]
        presentCount:
          type: number
          minimum: 0
        expectedCount:
          type: number
          minimum: 1
        observedCount:
          type: number
          minimum: 0
        archiveQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        archiveSizeBytes:
          type: number
          minimum: 0
        preferredQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
    AcquisitionSourceOption:
      type: object
      required: [id, provider, title, mediaType, scope, season, episode, quality, estimatedSizeBytes, availability, confidence]
      properties:
        id:
          oneOf:
            - type: number
            - type: string
        provider:
          type: string
        sourceKey:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        scope:
          type: string
          enum: [movie, episode, season]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        estimatedSizeBytes:
          type: [number, "null"]
        availability:
          $ref: "#/components/schemas/AcquisitionAvailability"
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionStorageImpact:
      type: object
      required: [estimatedBytes, freeBytesBefore, freeBytesAfter, status, summary]
      properties:
        estimatedBytes:
          type: [number, "null"]
        freeBytesBefore:
          type: [number, "null"]
        freeBytesAfter:
          type: [number, "null"]
        status:
          type: string
          enum: [sufficient, insufficient, unknown]
        summary:
          type: string
    AcquisitionRecommendation:
      type: object
      required: [status, priority, reason, candidateSources, expectedQuality, expectedStorageImpact, confidence, blockingReasons, archiveState]
      properties:
        status:
          type: string
          enum: [recommended, not_recommended]
        priority:
          type: string
          enum: [high, normal, low]
        reason:
          type: string
        candidateSources:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionSourceOption"
        expectedQuality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        expectedStorageImpact:
          $ref: "#/components/schemas/AcquisitionStorageImpact"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        blockingReasons:
          type: array
          items:
            type: string
        archiveState:
          type: string
          enum: [fully_present, partially_present, missing, present_lower_quality, uncertain]
    AcquisitionReview:
      type: object
      required: [status, note, updatedAt]
      properties:
        status:
          type: string
          enum: [unreviewed, reviewed, deferred, dismissed]
        note:
          type: [string, "null"]
        updatedAt:
          type: string
    AcquisitionFinding:
      type: object
      required: [id, need, recommendation, review, computedAt]
      properties:
        id:
          type: number
        need:
          $ref: "#/components/schemas/AcquisitionNeed"
        recommendation:
          $ref: "#/components/schemas/AcquisitionRecommendation"
        review:
          $ref: "#/components/schemas/AcquisitionReview"
        computedAt:
          type: string
    AcquisitionFindingSummary:
      type: object
      required: [total, recommended, blocked, highPriority]
      properties:
        total:
          type: number
          minimum: 0
        recommended:
          type: number
          minimum: 0
        blocked:
          type: number
          minimum: 0
        highPriority:
          type: number
          minimum: 0
    AcquisitionFindingPagination:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: number
          minimum: 1
        pageSize:
          type: number
          minimum: 1
        total:
          type: number
          minimum: 0
        totalPages:
          type: number
          minimum: 0
    AcquisitionFindingResponse:
      type: object
      required: [summary, pagination, results]
      properties:
        summary:
          $ref: "#/components/schemas/AcquisitionFindingSummary"
        pagination:
          $ref: "#/components/schemas/AcquisitionFindingPagination"
        results:
          type: array
          items:
            $ref: "#/components/schemas/AcquisitionFinding"
    AcquisitionRefreshResponse:
      type: object
      required: [computedAt, findingCount, recommendedCount, blockedCount]
      properties:
        computedAt:
          type: string
        findingCount:
          type: number
          minimum: 0
        recommendedCount:
          type: number
          minimum: 0
        blockedCount:
          type: number
          minimum: 0
    AcquisitionCandidateInput:
      type: object
      required: [identityKey, title, mediaType, scope, provider, availabilityState]
      properties:
        identityKey:
          type: string
        title:
          type: string
        mediaType:
          type: string
          enum: [movie, tv]
        scope:
          type: string
          enum: [movie, episode, season]
        year:
          type: [number, "null"]
        show:
          type: [string, "null"]
        season:
          type: [number, "null"]
        episode:
          type: [number, "null"]
        provider:
          type: string
        sourceKey:
          type: string
        discoveredId:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/AcquisitionTechnicalQuality"
            - type: "null"
        estimatedSizeBytes:
          type: [number, "null"]
        availabilityState:
          type: string
          enum: [unavailable, available, unknown]
        sourceConfidence:
          type: number
          minimum: 0
          maximum: 1
        checkedAt:
          type: [string, "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AcquisitionReviewUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unreviewed, reviewed, deferred, dismissed]
        note:
          type: [string, "null"]
          maxLength: 500
    ArchiveNamingProposalIdentity:
      type: object
      additionalProperties: true
      description: |
        Parsed or proposed media identity. Movie identities contain title and
        year fields; TV identities contain show, season, episode, episodes,
        episodeTitle, and ambiguity fields.

    ArchiveNamingProposal:
      type: object
      required:
        - fileRecordId
        - localIdentityId
        - sourcePath
        - proposedPath
        - sourceFilename
        - proposedFilename
        - currentIdentity
        - proposedIdentity
        - patternId
        - confidence
