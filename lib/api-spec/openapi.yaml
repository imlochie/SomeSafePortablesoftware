openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: system
    description: Local system status and diagnostics
  - name: settings
    description: Local application settings
  - name: plex
    description: Plex connection configuration
  - name: integrations
    description: External media integration adapter status
  - name: acquisition
    description: Durable provider-backed acquisition lifecycle
  - name: media
    description: Local media inspection and source selection
  - name: downloads
    description: Persistent local download jobs
  - name: archive
    description: Local archive inventory and media intelligence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [system]
      summary: Get archive system overview
      responses:
        "200":
          description: Current system overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /system/dependencies:
    get:
      operationId: getSystemDependencies
      tags: [system]
      summary: Detect optional local dependencies
      responses:
        "200":
          description: Detected dependency statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DependencyStatus"
  /system/events:
    get:
      operationId: getSystemEvents
      tags: [system]
      summary: Get recent system events
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get application settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update application settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /plex/config:
    get:
      operationId: getPlexConfig
      tags: [plex]
      summary: Get Plex configuration status
      responses:
        "200":
          description: Plex configuration without secrets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
    patch:
      operationId: updatePlexConfig
      tags: [plex]
      summary: Update Plex configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConfigUpdate"
      responses:
        "200":
          description: Updated Plex configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/test-connection:
    post:
      operationId: testPlexConnection
      tags: [plex]
      summary: Verify the configured Plex server
      responses:
        "200":
          description: Actual Plex connection result without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/sync:
    post:
      operationId: startPlexSync
      tags: [plex]
      summary: Start synchronizing the configured Plex inventory
      responses:
        "202":
          description: Plex synchronization started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexConfig"
  /plex/inventory:
    get:
      operationId: getPlexInventory
      tags: [plex]
      summary: Get the synchronized Plex inventory
      responses:
        "200":
          description: Owner-scoped Plex libraries and items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexInventory"
  /integrations/status:
    get:
      operationId: getIntegrationStatuses
      tags: [integrations]
      summary: Get external integration adapter status
      responses:
        "200":
          description: Configured, reachable, and operational adapter states without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatusResponse"
  /integrations/webhooks:
    get:
      operationId: getWebhookSecretStatuses
      tags: [integrations]
      summary: Get provider webhook secret status without credentials
      responses:
        "200":
          description: Provider webhook configuration and active overlap windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretStatusesResponse"
  /integrations/webhooks/{provider}:
    put:
      operationId: replaceWebhookSecret
      tags: [integrations]
      summary: Replace a provider webhook secret
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [sonarr, radarr]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateWebhookSecretBody"
      responses:
        "200":
          description: Updated provider webhook status without the secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretStatus"
        "400":
          description: Invalid webhook secret or rotation request
        "404":
          description: Unsupported provider
  /acquisition-jobs:
    get:
      operationId: getAcquisitionJobs
      tags: [acquisition]
      summary: List owner-scoped acquisition jobs
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AcquisitionJobState"
      responses:
        "200":
          description: Acquisition jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcquisitionJob"
    post:
      operationId: createAcquisitionJob
      tags: [acquisition]
      summary: Plan an acquisition and optionally send it to a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcquisitionJob"
      responses:
        "201":
          description: Acquisition job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Invalid acquisition request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition-jobs/{id}:
    get:
      operationId: getAcquisitionJob
      tags: [acquisition]
      summary: Inspect an acquisition job and its transition history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Acquisition job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "404":
          description: Acquisition job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition-jobs/{id}/retry:
    post:
      operationId: retryAcquisitionJob
      tags: [acquisition]
      summary: Retry a failed or cancelled acquisition job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Retried acquisition job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Acquisition retry rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition-jobs/{id}/cancel:
    post:
      operationId: cancelAcquisitionJob
      tags: [acquisition]
      summary: Cancel local acquisition tracking
      description: Cancelling tracking does not mutate local files or delete a provider download.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Cancelled acquisition job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Acquisition cancellation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition-jobs/{id}/progress:
    post:
      operationId: progressAcquisitionJob
      tags: [acquisition]
      summary: Advance an acquisition job through its canonical lifecycle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressAcquisitionJob"
      responses:
        "200":
          description: Progressed acquisition job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Invalid lifecycle transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /acquisition-jobs/{id}/refresh:
    post:
      operationId: refreshAcquisitionJob
      tags: [acquisition]
      summary: Refresh an acquisition job from its provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Refreshed acquisition job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Provider refresh failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/media-lookup:
    get:
      operationId: lookupArchiveMedia
      tags: [archive]
      summary: Look up TV and movie metadata through the integration registry
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: externalId
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            type: string
        - name: providerId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AcquisitionProvider"
      responses:
        "200":
          description: Provider media lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLookupResponse"
        "400":
          description: Lookup unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/missing-media:
    get:
      operationId: discoverArchiveMissingMedia
      tags: [archive]
      summary: Discover missing TV and movie media through the integration registry
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            type: string
        - name: providerId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AcquisitionProvider"
      responses:
        "200":
          description: Provider missing-media results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingMediaResponse"
        "400":
          description: Discovery unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/acquisitions:
    post:
      operationId: requestArchiveAcquisition
      tags: [archive, acquisition]
      summary: Request a provider acquisition while preserving archive context
      description: The request is persisted locally before its provider job is created. Provider state never replaces archive state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestArchiveAcquisition"
      responses:
        "201":
          description: Provider-backed acquisition tracking job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcquisitionJob"
        "400":
          description: Acquisition request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/scan:
    get:
      operationId: getArchiveScan
      tags: [archive]
      summary: Get the current local archive scan state
      responses:
        "200":
          description: Owner-scoped archive scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
    post:
      operationId: startArchiveScan
      tags: [archive]
      summary: Start a server-side archive filesystem scan
      responses:
        "202":
          description: Archive scan started or already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveScan"
  /archive/inventory:
    get:
      operationId: getArchiveInventory
      tags: [archive]
      summary: Get local archive inventory and intelligence
      responses:
        "200":
          description: Owner-scoped local files and Plex comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventory"
  /archive/records/{id}:
    get:
      operationId: getArchiveRecord
      tags: [archive]
      summary: Get one local archive record with comparison details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Archive record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveInventoryRecord"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateArchiveRecordReview
      tags: [archive]
      summary: Save a non-destructive review decision for an archive finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveReviewUpdate"
      responses:
        "200":
          description: Persisted review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReview"
        "400":
          description: Review is not valid for the current finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /archive/reviews:
    post:
      operationId: updateArchiveRecordReviews
      tags: [archive]
      summary: Save one review decision for several archive findings
      description: |
        Applies the selected status and one optional shared note to each archive
        finding in `ids`. The note is persisted independently for every
        successful result. Sending `null` clears an existing note; omitting the
        property has the same effect at the API boundary. The Archive UI
        currently sends `null` because bulk note entry is not exposed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveBulkReviewUpdate"
      responses:
        "200":
          description: Per-record bulk review outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveBulkReviewResponse"
        "400":
          description: Bulk review input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/inspect:
    post:
      operationId: inspectMediaSource
      tags: [media]
      summary: Inspect a media URL without downloading it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInspectInput"
      responses:
        "200":
          description: Normalized media metadata and formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaInspection"
        "400":
          description: Source could not be inspected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /media/local-inspect:
    post:
      operationId: inspectLocalMedia
      tags: [media]
      summary: Inspect a local media file with FFprobe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalMediaInspectInput"
      responses:
        "200":
          description: Local media inspection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalMediaInspection"
  /media/prepare-download:
    post:
      operationId: prepareDownload
      tags: [media]
      summary: Create a validated download specification without starting a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadPreparationInput"
      responses:
        "200":
          description: Prepared download specification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadSpecification"
  /downloads:
    get:
      operationId: getDownloads
      tags: [downloads]
      summary: List persistent download jobs
      responses:
        "200":
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
    post:
      operationId: createDownload
      tags: [downloads]
      summary: Create a persistent download job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadJobInput"
      responses:
        "201":
          description: Created download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/events:
    get:
      operationId: streamDownloadEvents
      tags: [downloads]
      summary: Stream download and processing updates
      responses:
        "200":
          description: Server-sent download events
          content:
            text/event-stream:
              schema:
                type: string
  /downloads/{id}:
    get:
      operationId: getDownload
      tags: [downloads]
      summary: Get one download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
    delete:
      operationId: deleteDownload
      tags: [downloads]
      summary: Delete a non-running download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "204":
          description: Deleted
  /downloads/{id}/start:
    post:
      operationId: startDownload
      tags: [downloads]
      summary: Start a queued or recoverable download job
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Started download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/pause:
    post:
      operationId: pauseDownload
      tags: [downloads]
      summary: Pause a running download where supported
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Paused or safely stopped for resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/resume:
    post:
      operationId: resumeDownload
      tags: [downloads]
      summary: Resume a paused or recoverable download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Resumed download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/cancel:
    post:
      operationId: cancelDownload
      tags: [downloads]
      summary: Cancel a running download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Cancelled download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      tags: [downloads]
      summary: Retry a failed download
      parameters:
        - $ref: "#/components/parameters/DownloadId"
      responses:
        "200":
          description: Retried download job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
components:
  parameters:
    DownloadId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StatusValue:
      type: string
      enum: [ready, connected, idle, placeholder, warning, unavailable, processing]
    SystemOverview:
      type: object
      required: [archiveStatus, plexStatus, queueStatus, processingStatus, storageStatus, aiStatus, lastSync, activity, activeDownloads, queuedJobs, processingJobs, completedToday, failedToday, storage]
      properties:
        archiveStatus:
          $ref: "#/components/schemas/StatusValue"
        plexStatus:
          $ref: "#/components/schemas/StatusValue"
        queueStatus:
          $ref: "#/components/schemas/StatusValue"
        processingStatus:
          $ref: "#/components/schemas/StatusValue"
        storageStatus:
          $ref: "#/components/schemas/StatusValue"
        aiStatus:
          $ref: "#/components/schemas/StatusValue"
        lastSync:
          type: ["string", "null"]
          format: date-time
        activity:
          type: array
          items:
            $ref: "#/components/schemas/SystemEvent"
        activeDownloads:
          type: number
        queuedJobs:
          type: number
        processingJobs:
          type: number
        completedToday:
          type: number
        failedToday:
          type: number
        storage:
          $ref: "#/components/schemas/StorageSummary"
    StorageSummary:
      type: object
      required: [path, freeBytes, totalBytes, usedBytes, freePercent, status]
      properties:
        path:
          type: string
        freeBytes:
          type: number
        totalBytes:
          type: number
        usedBytes:
          type: number
        freePercent:
          type: number
        status:
          type: string
          enum: [ready, warning, critical, unavailable]
    DependencyStatus:
      type: object
      required: [name, command, status, detail, version, capabilities]
      properties:
        name:
          type: string
        command:
          type: string
        status:
          type: string
          enum: [available, missing, not_configured]
        detail:
          type: string
        version:
          type: ["string", "null"]
        capabilities:
          type: array
          items:
            type: string
    SystemEvent:
      type: object
      required: [id, level, message, timestamp, source]
      properties:
        id:
          type: string
        level:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        source:
          type: string
    AppSettings:
      type: object
      required: [mockMode, dataDirectory, downloadDirectory, archiveDirectory, temporaryDirectory, ytDlpPath, ffmpegPath, ffprobePath, logLevel, hardwareAcceleration, hardwareAccelerationMode, networkMode, concurrentDownloads, maxRetries, bandwidthLimit, outputContainer, inspectionCacheMinutes, warningFreePercent, criticalFreePercent]
      properties:
        mockMode:
          type: boolean
        dataDirectory:
          type: string
        downloadDirectory:
          type: string
        archiveDirectory:
          type: string
        temporaryDirectory:
          type: string
        ytDlpPath:
          type: string
        ffmpegPath:
          type: string
        ffprobePath:
          type: string
        logLevel:
          type: string
          enum: [info, debug, warn, error]
        hardwareAcceleration:
          type: boolean
        hardwareAccelerationMode:
          type: string
          enum: [auto, disabled]
        networkMode:
          type: string
          enum: [offline, local_only, allow_network]
        concurrentDownloads:
          type: number
          minimum: 1
          maximum: 5
        maxRetries:
          type: number
          minimum: 0
          maximum: 10
        bandwidthLimit:
          type: number
          minimum: 0
        outputContainer:
          type: string
          enum: [mp4, mkv, webm]
        inspectionCacheMinutes:
          type: number
          minimum: 1
          maximum: 120
        warningFreePercent:
          type: number
          minimum: 1
          maximum: 50
        criticalFreePercent:
          type: number
          minimum: 1
          maximum: 25
    AppSettingsUpdate:
      type: object
      properties:
        mockMode:
          type: boolean
        dataDirectory:
          type: string
        downloadDirectory:
          type: string
        archiveDirectory:
          type: string
        temporaryDirectory:
          type: string
        ytDlpPath:
          type: string
        ffmpegPath:
          type: string
        ffprobePath:
          type: string
        logLevel:
          type: string
          enum: [info, debug, warn, error]
        hardwareAcceleration:
          type: boolean
        hardwareAccelerationMode:
          type: string
          enum: [auto, disabled]
        networkMode:
          type: string
          enum: [offline, local_only, allow_network]
        concurrentDownloads:
          type: number
          minimum: 1
          maximum: 5
        maxRetries:
          type: number
          minimum: 0
          maximum: 10
        bandwidthLimit:
          type: number
          minimum: 0
        outputContainer:
          type: string
