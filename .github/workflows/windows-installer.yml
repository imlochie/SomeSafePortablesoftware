name: Windows installer

# Builds the NSIS desktop installer on a real Windows runner. The staging
# scripts refuse to run anywhere but win32, and the packaged resource layout
# only exists in a bundled build, so this is the only place the desktop shell
# can actually be validated end to end.
on:
  workflow_dispatch:
  # Pull requests run the workflow definition from the PR head, which lets the
  # installer be validated before these files ever reach the default branch.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "artifacts/archive-assistant/src-tauri/**"
      - "artifacts/archive-assistant/scripts/**"
      - "artifacts/api-server/**"
      - ".github/workflows/windows-installer.yml"
      - "scripts/windows-installed-smoke.ps1"

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The repository has no packageManager field, so pin the pnpm version
      # explicitly rather than inheriting whatever Corepack defaults to.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/archive-assistant/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Proves the manifest's pinned sizes and SHA-256 hashes still match the
      # upstream assets before the much slower Tauri build starts. This is the
      # check that caught the rolling-tag drift.
      - name: Stage the bundled Node runtime and media tools
        working-directory: artifacts/archive-assistant
        run: |
          node ./scripts/stage-node-runtime.mjs
          node ./scripts/stage-media-tools.mjs

      - name: Verify the staged runtime and tools
        working-directory: artifacts/archive-assistant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in 'runtime/node.exe',
                                'runtime/media-tools/ffmpeg.exe',
                                'runtime/media-tools/ffprobe.exe',
                                'runtime/media-tools/yt-dlp.exe',
                                'runtime/media-tools/manifest.json') {
            $path = Join-Path 'src-tauri' $relative
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Staging did not produce $relative"
            }
            Write-Host ("{0,-42} {1,12:N0} bytes" -f $relative, (Get-Item -LiteralPath $path).Length)
          }

      - name: Build the signed desktop installer and updater artifact
        working-directory: artifacts/archive-assistant
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run desktop:build

      # The packaged layout is what the Rust resource lookup depends on, and it
      # cannot be observed from a dev build. Failing here is far cheaper than
      # shipping an installer whose sidecar cannot find its API bundle.
      - name: Verify the packaged resource layout
        working-directory: artifacts/archive-assistant/src-tauri/target/release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # On Windows resource_dir() is the directory containing the exe, with
          # no "resources" segment -- tauri-utils returns exe_dir directly under
          # cfg!(target_os = "windows"). So resources sit beside the exe here in
          # target/release, and beside it again in $INSTDIR once installed.
          # Checking a "resources" subdirectory would look somewhere the app
          # never reads and pass or fail for the wrong reason.
          #
          # runtime/node.exe is listed because a bare "runtime" resource entry
          # once packaged nothing, producing an app that found its API bundle
          # and then could not start it.
          foreach ($relative in 'api-server/dist/index.mjs',
                                'runtime/node.exe',
                                'runtime/media-tools/ffmpeg.exe',
                                'runtime/media-tools/ffprobe.exe',
                                'runtime/media-tools/yt-dlp.exe') {
            if (-not (Test-Path -LiteralPath $relative)) {
              Write-Host 'Packaged resource tree (two levels):'
              Get-ChildItem -Recurse -Depth 2 -File . |
                ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "Packaged resource missing: $relative"
            }
            Write-Host "ok  $relative"
          }

      - name: Install the NSIS package into a clean temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath 'artifacts/archive-assistant/src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstall' } |
            Select-Object -First 1
          if (-not $installer) { throw 'The NSIS installer executable was not produced.' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'archive-assistant-installed'
          Remove-Item -LiteralPath $installDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installDirectory | Out-Null
          $result = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($result.ExitCode)." }
          "ARCHIVE_ASSISTANT_INSTALL_DIR=$installDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test the installed application
        shell: pwsh
        run: |
          & .\scripts\windows-installed-smoke.ps1 -InstallDirectory $env:ARCHIVE_ASSISTANT_INSTALL_DIR

      - name: Upload installed smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-assistant-installed-smoke-logs
          path: |
            ${{ runner.temp }}/archive-assistant-smoke-work/**
            ${{ runner.temp }}/archive-assistant-installed/**/lifecycle.log
          if-no-files-found: warn

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: archive-assistant-windows-installer
          path: |
            artifacts/archive-assistant/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/archive-assistant/src-tauri/target/release/bundle/nsis/*.sig
            artifacts/archive-assistant/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
